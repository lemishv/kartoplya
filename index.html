/* ============================================================
   КАРТОПЛЯ — контурний стиль (експеримент за мотивами фото).
   Глибока синя база, контурні картки з тонкою рамкою,
   зелений акцент, sans-serif Manrope, круглі елементи.
   Без неоморфних тіней — інша мова, ніж робоча версія.
   ============================================================ */
:root {
  --bg:        #111a26;   /* глибока ніч-синь — простір СОРТІВ */
  --surface:   #18222f;
  --surface-2: #1f2b3a;
  --border:    #2b3a4d;   /* контурні рамки */
  --border-hi: #3a4d63;
  --text:      #eef3f8;
  --text-dim:  #8da0b5;
  --text-faint:#5a6b7e;
  --accent:    #5cc46a;   /* зелений (нейтральний акцент) */
  --accent-hi: #7ddc8a;
  --accent-dim:#2f5e36;
  --danger:    #dc3b6b;   /* Краплак (малиновий) — дії шедів/видалення */
  --move:      #1bb6e0;   /* Церулеум (блакитний) — переміщення */
  --radius:    20px;
  --radius-sm: 14px;
  --sp-sorts:  #111a26;
  --sp-sheds:  #14201c;
  --sp-stats:  #1a1726;
  --sp-log:    #1a1a1a;
  --nav-bg:    rgba(17,26,38,.92);
}
/* СВІТЛА ТЕМА — під контурний стиль: світлий фон, темний текст, видимі рамки */
body.light {
  --bg:        #f4f6f9;
  --surface:   #ffffff;
  --surface-2: #eef1f5;
  --border:    #d8dee6;
  --border-hi: #c2cbd6;
  --text:      #1a2230;
  --text-dim:  #5d6b7d;
  --text-faint:#9aa6b4;
  --accent:    #3f9e4d;
  --accent-hi: #2f7d3b;
  --accent-dim:#cfe8d3;
  --danger:    #d12f60;
  --move:      #1395bb;
  --sp-sorts:  #f4f6f9;
  --sp-sheds:  #eef6f0;
  --sp-stats:  #f3f0f8;
  --sp-log:    #f2f2f3;
  --nav-bg:    rgba(244,246,249,.92);
}
/* Простори — тонка зміна фону (через змінні, тому працює в обох темах) */
body[data-space="sorts"] { background:var(--sp-sorts); }
body[data-space="sheds"] { background:var(--sp-sheds); }
body[data-space="stats"] { background:var(--sp-stats); }
body[data-space="log"]   { background:var(--sp-log); }
body { transition: background .35s ease; }
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body {
  background: var(--bg); color: var(--text);
  font-family:'Manrope', sans-serif; font-size:16px;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
}
body { padding: env(safe-area-inset-top) 0 0 0; min-height:100vh; }

#app { padding: 14px 16px 96px; max-width:560px; margin:0 auto; }
#topctl { position:fixed; top:calc(8px + env(safe-area-inset-top)); right:14px; z-index:60; display:flex; gap:8px; }
#topctl button { background:var(--surface); border:1px solid var(--border); color:var(--text-dim); width:40px; height:40px; border-radius:12px; cursor:pointer; font-family:inherit; font-weight:700; font-size:0.82rem; display:flex; align-items:center; justify-content:center; }
#topctl button:active { background:var(--surface-2); }
#topctl svg { width:20px; height:20px; stroke:var(--text-dim); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
#topctl button:focus-visible, .btn:focus-visible, #nav button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
#btn-data { position:relative; }
#btn-data .dot { position:absolute; top:6px; right:6px; width:8px; height:8px; border-radius:50%; background:#e0a93b; box-shadow:0 0 0 2px var(--surface); }
/* заголовок списку не залазить під кнопки у правому куті */
#app > .screen-title:first-child { padding-right:140px; }

.screen-title { font-size:1.85rem; font-weight:800; letter-spacing:-0.02em; margin:8px 2px 20px; display:flex; align-items:center; gap:12px; }
.screen-title .space-ic { width:30px; height:30px; flex:none; opacity:.85; }
.screen-title .space-ic svg { width:100%; height:100%; stroke:var(--text-dim); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.icon-btn { background:none; border:none; padding:6px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; margin-left:auto; }
.icon-btn svg { width:20px; height:20px; stroke:var(--text-dim); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.icon-btn:active svg { stroke:var(--text); }
.screen-sub { color:var(--text-dim); font-size:0.82rem; margin:-14px 2px 20px; }

/* ---- Bottom nav ---- */
#nav {
  position:fixed; bottom:0; left:0; right:0; display:flex;
  background: var(--nav-bg); backdrop-filter: blur(12px);
  border-top:1px solid var(--border);
  padding:10px 6px calc(10px + env(safe-area-inset-bottom)); z-index:50;
}
#nav button {
  flex:1; background:none; border:none; color:var(--text-faint);
  font-family:inherit; font-size:0.66rem; font-weight:600;
  display:flex; flex-direction:column; align-items:center; gap:4px;
  padding:4px 0; cursor:pointer; transition:color .15s;
}
#nav button svg { width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
#nav button.active { color:var(--accent); }

/* ---- Contoured cards ---- */
.plate {
  background: var(--surface);
  border:1px solid var(--border);
  border-radius: var(--radius);
  padding:18px 20px; margin-bottom:14px; cursor:pointer;
  transition: border-color .15s, transform .12s;
}
.plate:active { transform:scale(0.99); border-color:var(--border-hi); }
.plate-row { display:flex; justify-content:space-between; align-items:center; gap:10px; }
.plate-title { font-size:1.2rem; font-weight:700; }
.plate-big   { font-size:1.6rem; font-weight:800; color:var(--accent-hi); letter-spacing:-0.02em; }
.plate-big small { font-size:.62rem; color:var(--text-faint); font-weight:600; }
.plate-meta  { color:var(--text-dim); font-size:0.8rem; margin-top:6px; }
.plate-tag {
  display:inline-block; font-size:0.7rem; color:var(--text-dim);
  background:var(--surface-2); border:1px solid var(--border);
  padding:3px 10px; border-radius:20px; margin:4px 5px 0 0;
}
/* icon chip in corner (фарбується під колір сорту) */
.chip-ic {
  width:40px; height:40px; border-radius:12px; flex:none;
  background: var(--accent-dim); display:flex; align-items:center; justify-content:center;
}
.chip-ic svg { width:20px; height:20px; stroke:var(--accent-hi); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
/* плашка сорту з кольоровим лівим кантом */
.plate.colored { border-left-width:4px; }

/* hero summary card (як Total Balance) */
.hero {
  background: var(--surface); border:1px solid var(--border);
  border-radius:24px; padding:24px; margin-bottom:22px;
}
.hero-compact {
  display:flex; align-items:baseline; justify-content:space-between; gap:12px;
  padding:14px 18px; margin-bottom:20px;
  background:var(--surface); border:1px solid var(--border); border-radius:16px;
}
.hc-main { display:flex; align-items:baseline; gap:9px; }
.hc-num { font-size:1.9rem; font-weight:800; letter-spacing:-0.02em; color:var(--accent-hi); }
.hc-unit { font-size:0.8rem; color:var(--text-dim); }
.hc-side { font-size:0.82rem; color:var(--text-dim); white-space:nowrap; }
.hc-dot { margin:0 6px; color:var(--text-faint); }
/* перемикачі статистики */
.seg { display:flex; gap:6px; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:5px; margin-bottom:12px; }
.seg button { flex:1; background:none; border:none; color:var(--text-dim); font-family:inherit; font-size:0.85rem; font-weight:600; padding:10px 6px; border-radius:10px; cursor:pointer; transition:.15s; }
.seg button.on { background:var(--surface-2); color:var(--accent-hi); }
.seg-sm button { font-size:0.78rem; padding:9px 4px; }
.seg-sm { margin-bottom:20px; }
/* список розрізів */
.stat-list { display:flex; flex-direction:column; gap:14px; }
.stat-row { }
.stat-top { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:7px; }
.stat-label { font-size:1rem; font-weight:600; color:var(--text); }
.stat-num { font-size:1.15rem; font-weight:800; white-space:nowrap; }
.stat-pct { font-size:0.78rem; color:var(--text-dim); font-weight:500; }
.stat-bar { height:8px; background:var(--surface-2); border:1px solid var(--border); border-radius:5px; overflow:hidden; }
.stat-fill { height:100%; border-radius:5px; transition:width .3s; }
/* блок статистики всередині сорту/ID */
.stat-block { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:16px 18px; margin-bottom:18px; }
.sb-head { display:flex; justify-content:space-between; align-items:baseline; padding-bottom:12px; margin-bottom:12px; border-bottom:1px solid var(--border); }
.sb-head span:first-child { color:var(--text-dim); font-size:0.9rem; }
.sb-big { font-size:1.5rem; font-weight:800; letter-spacing:-0.02em; }
.sb-section { margin-bottom:12px; }
.sb-section:last-child { margin-bottom:0; }
.sb-title { font-size:0.8rem; color:var(--text-dim); font-weight:600; margin-bottom:6px; }
.sb-line { display:flex; justify-content:space-between; align-items:baseline; padding:5px 0; font-size:0.95rem; }
.sb-line span:first-child { color:var(--text); }
.sb-q { font-weight:700; white-space:nowrap; }
.sb-pct { font-size:0.76rem; color:var(--text-faint); font-weight:600; margin-left:8px; }
.sb-empty span { color:var(--text-faint); }
.sb-loss span:first-child { color:var(--text-faint); }
.sb-loss .sb-q { color:var(--text-faint); }
.hero .label { color:var(--text-dim); font-size:0.85rem; font-weight:600; }
.hero .value { font-size:2.8rem; font-weight:800; letter-spacing:-0.03em; margin:6px 0 18px; }
.hero .value small { font-size:1rem; color:var(--text-faint); font-weight:600; }
.hero-grid { display:flex; gap:16px; }
.hero-grid .col { flex:1; }
.hero-grid .col .k { color:var(--text-dim); font-size:0.78rem; font-weight:600; }
.hero-grid .col .v { font-size:1.5rem; font-weight:800; margin-top:4px; }

.empty { text-align:center; color:var(--text-faint); padding:54px 20px; font-size:0.92rem; line-height:1.7; }
.empty svg { width:46px; height:46px; stroke:var(--text-faint); fill:none; stroke-width:1.5; opacity:.6; margin-bottom:14px; }

.cap-bar { height:7px; background:var(--surface-2); border:1px solid var(--border); border-radius:5px; margin-top:12px; overflow:hidden; }
.cap-fill { height:100%; background:var(--accent); border-radius:5px; transition:width .3s; }
.cap-fill.full { background:var(--danger); }
.id-chips { display:flex; flex-wrap:wrap; gap:7px; margin-top:14px; }
.id-chip { font-size:0.82rem; font-weight:600; padding:5px 11px; border-radius:20px; border:1.5px solid; background:transparent; white-space:nowrap; color:var(--text-dim); }
.id-chip-code { color:var(--text); font-weight:700; }
/* заголовок шеду: назва + місткість як окрема плашка */
.title-row { display:flex; align-items:center; gap:10px; margin:8px 2px 12px; }
.title-row .screen-title { margin:0; flex:1; min-width:0; }
.title-row .screen-title span:not(.space-ic) { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.cap-chip { flex:none; display:flex; flex-direction:column; align-items:flex-end; line-height:1.1; padding:6px 12px; border:1px solid var(--border); border-radius:12px; background:var(--surface); }
.cap-chip b { font-size:1.15rem; font-weight:800; font-variant-numeric:tabular-nums; }
.cap-chip small { font-size:.62rem; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--text-faint); }
/* заповненість: смуга + зайнято / вільно */
.fill-box { margin:0 2px 18px; }
.fill-legend { display:flex; justify-content:space-between; gap:12px; margin-top:9px; font-size:.86rem; color:var(--text-dim); }
.fill-legend b { font-size:1.1rem; font-weight:800; font-variant-numeric:tabular-nums; margin-right:5px; }
.fill-legend .occ b { color:var(--accent-hi); }
.fill-legend .free b { color:var(--text); }
.fill-legend .free.none b { color:var(--danger); }
.fill-note { font-size:.82rem; color:var(--text-dim); margin:0 2px 18px; }

/* ---- Buttons ---- */
.btn {
  width:100%; padding:16px; border:none; border-radius:var(--radius);
  font-family:inherit; font-size:1rem; font-weight:700;
  background:var(--accent); color:#06180a; cursor:pointer; transition:transform .1s; margin-top:8px;
}
.btn:active { transform:scale(0.98); }
.btn.secondary { background:var(--surface); color:var(--text); border:1px solid var(--border); }
.btn.ghost { background:none; color:var(--text-dim); }

.fab {
  position:fixed; right:18px; bottom:calc(80px + env(safe-area-inset-bottom));
  width:58px; height:58px; border:none; cursor:pointer; z-index:45;
  display:flex; align-items:center; justify-content:center;
  background:var(--accent); transition:transform .1s, background .2s, border-radius .2s;
}
.fab:active { transform:scale(0.94); }
.fab svg { width:26px; height:26px; stroke:#06180a; fill:none; stroke-width:2.5; stroke-linecap:round; }
/* форми за дією */
.fab.f-sorts { border-radius:50%; background:#4fa238; }            /* кругла зелена */
.fab.f-sheds { border-radius:16px; background:#dc3b6b; }           /* квадратна малинова */
.fab.f-sheds svg { stroke:#1a0610; }
.fab.f-move  { background:none; }                                  /* трикутна блакитна */
.fab.f-move .tri { width:0;height:0; border-left:29px solid transparent; border-right:29px solid transparent; border-bottom:50px solid var(--move); position:relative; }
.fab.f-move .tri::after { content:'+'; position:absolute; left:-7px; top:18px; color:#04222b; font-size:1.3rem; font-weight:800; }
.fab.f-dig { background:#e0a93b; clip-path:polygon(50% 8%, 92% 88%, 8% 88%); border-radius:0; }  /* трикутна золота — завезти */
.fab.f-dig svg { stroke:#2a1a04; width:22px; height:22px; transform:translateY(4px); }
.fab.f-take { background:#dc3b6b; clip-path:polygon(50% 92%, 92% 12%, 8% 12%); border-radius:0; }  /* трикутна червона вниз — зняти */
.fab.f-take svg { stroke:#2a0410; width:22px; height:22px; transform:translateY(-4px); }

/* ---- Sheet ---- */
.sheet-bg { position:fixed; inset:0; background:rgba(0,0,0,.65); z-index:100; display:flex; align-items:flex-end; opacity:0; pointer-events:none; transition:opacity .2s; }
.sheet-bg.open { opacity:1; pointer-events:auto; }
.sheet { background:var(--surface); width:100%; max-width:560px; margin:0 auto; border:1px solid var(--border); border-bottom:none; border-radius:24px 24px 0 0; padding:24px 18px calc(24px + env(safe-area-inset-bottom)); max-height:90vh; overflow-y:auto; transform:translateY(100%); transition:transform .25s cubic-bezier(.2,.8,.2,1); }
.sheet input:focus { scroll-margin-bottom:320px; }
.sheet-bg.open .sheet { transform:translateY(0); }
.sheet-handle { width:40px; height:4px; background:var(--border-hi); border-radius:2px; margin:0 auto 18px; }
.sheet-top { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; }
.sheet-x { flex:none; width:38px; height:38px; border-radius:11px; border:1px solid var(--border); background:var(--surface-2); color:var(--text-dim); font-size:1.1rem; cursor:pointer; }
.sheet-x:active { background:var(--surface); }
.sheet h2 { font-size:1.35rem; font-weight:800; margin-bottom:20px; }

/* ---- Inputs ---- */
.field { margin-bottom:16px; }
.field label { display:block; font-size:0.74rem; font-weight:600; color:var(--text-dim); margin-bottom:8px; }
.field input, .field select {
  width:100%; padding:15px 16px; font-size:1.05rem; font-family:inherit; font-weight:500;
  background:var(--surface-2); color:var(--text);
  border:1px solid var(--border); border-radius:var(--radius-sm);
}
.field input:focus, .field select:focus { outline:none; border-color:var(--accent); }
.field input::placeholder { color:var(--text-faint); }
.field-row { display:flex; gap:10px; }
.field-row .field { flex:1; }
.hint { font-size:0.72rem; color:var(--text-faint); margin-top:6px; }

.char-row { display:flex; gap:8px; margin-bottom:8px; }
.char-row input { flex:1; }
.char-del { background:var(--surface-2); border:1px solid var(--border); color:var(--danger); border-radius:12px; padding:0 16px; font-size:1.1rem; cursor:pointer; }
.add-char { background:none; border:1px dashed var(--border-hi); color:var(--text-dim); width:100%; padding:12px; border-radius:var(--radius-sm); font-family:inherit; font-weight:600; cursor:pointer; font-size:0.84rem; margin-bottom:6px; }
.sr-x { position:absolute; top:8px; right:10px; width:26px; height:26px; border:none; border-radius:50%; background:none; color:var(--text-faint); font-size:1.2rem; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.sr-x:active { background:var(--danger); color:#fff; }

.confirm-armed { background:var(--danger) !important; color:#1a0606 !important; }

.drow { display:flex; justify-content:space-between; padding:14px 2px; border-bottom:1px solid var(--border); font-size:0.92rem; }
.drow:last-child { border-bottom:none; }
.drow .k { color:var(--text-dim); }

.loc-line { display:flex; justify-content:space-between; align-items:center; padding:12px 14px; background:var(--surface-2); border:1px solid var(--border); border-radius:14px; margin-bottom:8px; font-size:0.85rem; }
.loc-line .where { color:var(--text-dim); line-height:1.5; }
.loc-line .qty { font-size:1.2rem; font-weight:800; color:var(--accent-hi); }
/* ---- Графічна сітка шеду (стиль калькулятора) ---- */
.shed-grid-wrap { margin:6px 0 4px; }
.shed-grid-scroll { overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:4px; }
.shed-grid { display:flex; flex-direction:column; gap:6px; width:max-content; min-width:100%; }
.grow-wrap { display:flex; align-items:center; gap:8px; }
.grow-n { flex:none; width:54px; text-align:right; font-weight:700; font-size:0.8rem; color:var(--text-dim); white-space:nowrap; }
.grow { display:flex; gap:6px; }

.toast { position:fixed; bottom:calc(100px + env(safe-area-inset-bottom)); left:16px; right:16px; margin-inline:auto; width:fit-content; max-width:520px; transform:translateY(20px); background:var(--accent); color:#06180a; padding:13px 22px; border-radius:24px; font-size:0.85rem; font-weight:700; line-height:1.4; text-align:center; opacity:0; pointer-events:none; transition:.25s; z-index:200; }

.btn:disabled { opacity:.4; cursor:not-allowed; }

/* ===== ШАР ДАНИХ db.* (ідентичний робочій версії) ===== */
const db = (() => {
  const DB_VERSION=3, STORES=['sorts','ids','sheds','batches','ops'];   // схема та сама, що в робочій версії
  let _db=null,_open=null;
  function open(){ if(_db)return Promise.resolve(_db); if(_open)return _open;
    _open=new Promise((res,rej)=>{ const r=indexedDB.open(DB_NAME,DB_VERSION);
      r.onupgradeneeded=e=>{const d=e.target.result;
        STORES.forEach(s=>{ if(!d.objectStoreNames.contains(s)) d.createObjectStore(s,{keyPath:'key'}); });
      };
      r.onsuccess=()=>{_db=r.result;res(_db);};
      r.onerror=()=>rej(r.error);
      r.onblocked=()=>rej(new Error('blocked'));
    }); return _open; }
  function tx(s,m='readonly'){return open().then(d=>d.transaction(s,m).objectStore(s));}
  function all(s){return tx(s).then(st=>new Promise((res,rej)=>{const r=st.getAll();r.onsuccess=()=>res(r.result.map(x=>x.val));r.onerror=()=>rej(r.error);}));}
  function put(s,v){return tx(s,'readwrite').then(st=>new Promise((res,rej)=>{const r=st.put({key:v.id,val:v});r.onsuccess=()=>res(v);r.onerror=()=>rej(r.error);}));}
  function del(s,id){return tx(s,'readwrite').then(st=>new Promise((res,rej)=>{const r=st.delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);}));}
  const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  return {
    listSorts:()=>all('sorts'), saveSort:o=>put('sorts',o), delSort:id=>del('sorts',id), newSort:()=>uid('so_'),
    listIds:()=>all('ids'), saveId:o=>put('ids',o), delId:id=>del('ids',id), newId:()=>uid('id_'),
    listSheds:()=>all('sheds'), saveShed:o=>put('sheds',o), delShed:id=>del('sheds',id), newShed:()=>uid('sh_'),
    listBatches:()=>all('batches'), saveBatch:o=>put('batches',o), delBatch:id=>del('batches',id), newBatch:()=>uid('b_'),
    listOps:()=>all('ops'), saveOp:o=>put('ops',o), delOp:id=>del('ops',id), newOp:()=>uid('op_'),
    // атомарно: партії + журнал в одній транзакції (або все, або нічого)
    commit:({put=[],del=[],ops=[]})=>open().then(d=>new Promise((res,rej)=>{
      const x=d.transaction(['batches','ops'],'readwrite'); const bs=x.objectStore('batches'), os=x.objectStore('ops');
      put.forEach(b=>bs.put({key:b.id,val:b})); del.forEach(id=>bs.delete(id)); ops.forEach(o=>os.put({key:o.id,val:o}));
      x.oncomplete=()=>res(); x.onerror=()=>rej(x.error); x.onabort=()=>rej(x.error||new Error('abort'));
    })),
    // повна заміна всіх даних (імпорт, стирання) — теж одна транзакція
    replaceAll:data=>open().then(d=>new Promise((res,rej)=>{
      const x=d.transaction(STORES,'readwrite');
      STORES.forEach(s=>{ const st=x.objectStore(s); st.clear(); (data[s]||[]).forEach(v=>st.put({key:v.id,val:v})); });
      x.oncomplete=()=>res(); x.onerror=()=>rej(x.error); x.onabort=()=>rej(x.error||new Error('abort'));
    })),
    STORES,
  };
})();

function pl(n,key){ const f=t(key).split('|');
  if(LANG!=='uk') return n===1?f[0]:f[f.length-1];
  const a=n%10, b=n%100;
  return (a===1&&b!==11)?f[0]:(a>=2&&a<=4&&(b<12||b>14))?f[1]:f[2]; }
// бирка ID: колір сорту як на справжній наліпці, контрастне чорнило
function inkFor(hex){
  const n=parseInt(String(hex).replace('#',''),16);
  const [r,g,b]=[(n>>16)&255,(n>>8)&255,n&255].map(v=>{ v/=255; return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4); });
  const L=0.2126*r+0.7152*g+0.0722*b;
  return (L+0.05)/0.05 >= 1.05/(L+0.05) ? '#10161d' : '#ffffff';
}

const pig = id => { const p=PIGMENTS.find(x=>x.id===id)||PIGMENTS[0]; return (THEME==='light'&&p.lc)?{...p,c:p.lc,b:p.lb}:p; };
// контрастна послідовність: 0, кінець, 1, кінець-1, ... — сусіди далеко в спектрі
function pigByOrder(idx){
  const n=PIGMENTS.length;
  const seq=[]; let lo=0, hi=n-1, take='lo';
  while(lo<=hi){ if(take==='lo'){seq.push(lo++);take='hi';} else {seq.push(hi--);take='lo';} }
  return PIGMENTS[seq[idx % n]];
}

// багаторядковий читабельний опис операції
function logBody(op){

    }).join('');
    const loss=(u.loss!=null)?u.loss:(u.input - u.results.reduce((s,r)=>s+r.qty,0));
    const lossPct=u.input?Math.round(loss/u.input*100):0;
    return `<div class="log-head">${esc(id?id.code:'?')} · ${esc(so?so.name:'?')} · ${t('taken')} ${u.input}</div>${rows}${loss>0?`<div class="log-line log-loss"><span>${t('losses')}</span><span class="log-q">${loss}<span class="log-pct">${lossPct}%</span></span></div>`:''}`;
  }
  if(op.type==='move' && u){
    const id=idById(u.idRef); const so=sortById(id?id.sortId:null);
    return `<div class="log-head">${esc(id?id.code:'?')} · ${esc(so?so.name:'?')}${u.size?' · '+esc(u.size):''}</div>
      <div class="log-line"><span>${esc(shedById(u.fromShed)?.name||'?')} → ${esc(shedById(u.toShed)?.name||'?')}</span><span class="log-q">${u.qty}</span></div>`;
  }
  if(op.type==='sell' && u){
    const id=idById(u.idRef); const so=sortById(id?id.sortId:null);
    const fromName = shedById(u.shedId||u.fromShed)?.name||'';
    return `<div class="log-head">${esc(id?id.code:'?')} · ${esc(so?so.name:'?')}${u.size?' · '+esc(u.size):''}</div>
      <div class="log-line"><span>${fromName?esc(fromName)+' → ':''}${t('sold')}</span><span class="log-q">${u.qty}</span></div>`;
  }
  if(op.type==='writeoff' && u){
    const id=idById(u.idRef); const so=sortById(id?id.sortId:null);
    return `<div class="log-head">${esc(id?id.code:'?')} · ${esc(so?so.name:'?')}${u.size?' · '+esc(u.size):''}</div>
      <div class="log-line"><span>${esc(shedById(u.shedId)?.name||'')} → ${t('writeoff')}</span><span class="log-q">${u.qty}</span></div>`;
  }
  if((op.type==='dig'||op.type==='place') && u){
    const id=idById(u.idRef); const so=sortById(id?id.sortId:null);
    const placed=u.placed||[];
    const pos=placed.filter(p=>p.row||p.stack), nop=placed.some(p=>!p.row&&!p.stack);
    const rows=[...new Set(pos.map(p=>String(p.row)))];
    const parts=rows.map(r=>`${t('row')} ${r}, ${t('stack').toLowerCase()} ${ranges(pos.filter(p=>String(p.row)===r).map(p=>+p.stack))}`);
    if(nop) parts.push(t('no_position'));
    const where=parts.join('; ');
    return `<div class="log-head">${esc(id?id.code:'?')} · ${esc(so?so.name:'?')}${u.size?' · '+esc(u.size):''}</div>
      <div class="log-line"><span>→ ${esc(shedById(u.shedId)?.name||'?')}${where?', '+esc(where):''}</span><span class="log-q">${u.qty}</span></div>`;
  }
  return op.detail?`<div class="log-head">${esc(op.detail)}</div>`:'';
}

// ---- СТОРНО ----
// План зворотної операції: R — що зняти, A — що повернути. null — старий формат, безпечне сторно неможливе.
function undoPlan(op){
  const u=op&&op.undo; if(!u||!u.idRef) return null;
  const sz=u.size||''; const R=[], A=[];
  switch(op.type){
    case 'dig':
      if(!u.shedId||!u.placed||!u.placed.length) return null;
      u.placed.forEach(p=>R.push([u.idRef,sz,'shed',u.shedId,p.row,p.stack,p.qty])); break;
    case 'place':
      if(!u.shedId||!u.placed) return null;
      u.placed.forEach(p=>R.push([u.idRef,sz,'shed',u.shedId,p.row,p.stack,p.qty]));
      A.push([u.idRef,sz,'shed',u.shedId,'','',u.qty]); break;
    case 'move':
      if(u.taken&&u.fromShed&&u.toShed){ R.push([u.idRef,sz,'shed',u.toShed,'','',u.qty]); u.taken.forEach(k=>A.push([u.idRef,sz,'shed',u.fromShed,k.row,k.stack,k.qty])); }
      else if(!u.taken&&u.fromShed&&u.toShed){ R.push([u.idRef,sz,'shed',u.toShed,u.toRow||'',u.toStack||'',u.qty]); A.push([u.idRef,sz,'shed',u.fromShed,u.fromRow||'',u.fromStack||'',u.qty]); }
      else return null; break;
    case 'writeoff':
      if(!u.taken||!u.shedId) return null;
      u.taken.forEach(k=>A.push([u.idRef,sz,'shed',u.shedId,k.row,k.stack,k.qty])); break;
    case 'sell':
      if(u.size===undefined) return null;                        // старий продаж без розміру
      R.push([u.idRef,sz,'sold','*','','',u.qty]);
      if(u.taken&&u.shedId) u.taken.forEach(k=>A.push([u.idRef,sz,'shed',u.shedId,k.row,k.stack,k.qty]));
      else if(u.fromShed) A.push([u.idRef,sz,'shed',u.fromShed,u.fromRow||'',u.fromStack||'',u.qty]);
      else return null; break;
    case 'sort':
      if(u.taken&&u.shedId){ (u.results||[]).forEach(r=>R.push([u.idRef,r.size||'','shed',u.shedId,'','',r.qty])); u.taken.forEach(k=>A.push([u.idRef,'','shed',u.shedId,k.row,k.stack,k.qty])); }
      else if(u.shedId&&u.toShed&&u.input){ (u.results||[]).forEach(r=>R.push([u.idRef,r.size||'','shed',u.shedId,'','',r.qty])); A.push([u.idRef,u.fromSize||'','shed',u.toShed,u.row||'',u.stack||'',u.input]); }
      else return null; break;
    default: return null;
  }
  return {R,A};
}
function laterOpsCount(op){ const idRef=op.undo&&op.undo.idRef; if(!idRef) return 0;
  return state.ops.filter(o=>o.id!==op.id && !o.reversed && (o.ts||0)>(op.ts||0) && o.undo && o.undo.idRef===idRef).length; }
function openOpActions(opId){
  const op=state.ops.find(o=>o.id===opId); if(!op||!op.undo||op.reversed) return;
  const plan=undoPlan(op), later=laterOpsCount(op);
  openSheet(`<div class="sheet-top"><h2 style="margin:0">${esc(opTitle(op))}</h2><button class="sheet-x" onclick="closeSheet()">✕</button></div>
    <div class="log-body" style="margin-bottom:14px">${logBody(op)}</div>
    ${plan?`${later?`<div class="warn-box">${t('undo_later1')} ${later} ${pl(later,'ops_f')}. ${t('undo_later2')}</div>`:''}
      <p class="hint" style="margin-bottom:14px">${t('undo_hint2')}</p>
      <button class="btn" data-armed="0" onclick="confirmUndo(this,${ja(opId)})" style="background:var(--danger);color:#fff">${t('op_undo')}</button>`
    :`<p class="hint">${t('undo_legacy')}</p>`}`);
}
function confirmUndo(btn,opId){ if(btn.dataset.armed==='1'){ doUndo(opId); return; }
  btn.dataset.armed='1'; btn.textContent=t('undo_confirm');
  setTimeout(()=>{ if(btn.isConnected){btn.dataset.armed='0';btn.textContent=t('op_undo');} },4000); }
async function doUndo(opId){
  const op=state.ops.find(o=>o.id===opId); if(!op||op.reversed) return;
  const plan=undoPlan(op); if(!plan){ toast(t('undo_legacy'),true); return; }
  const ok=await runOp(d=>{
    plan.R.forEach(a=>d.remove(...a));
    plan.A.forEach(a=>d.add(...a));
    return {...op, reversed:true, reversedAt:Date.now()};
  }, t('op_cancelled'), t('undo_blocked')+' ');
  if(ok){ closeSheet(); render(); }
}

// Графічна сітка шеду — стиль калькулятора: ряди зверху вниз, стопки підписані зліва.
function shedGrid(sh, lines){
  const cfg = sh.rowsCfg||[];
  const cells={}; let noPosById={};
  lines.forEach(({b,l,id})=>{
    if(!l.row && !l.stack){ if(!id)return; const k=id.id;
      if(!noPosById[k]){ const so=sortById(id.sortId); noPosById[k]={code:id.code,color:so?so.color:'skoda',size:b.size||'',qty:0}; }
      noPosById[k].qty+=(+l.qty||0); return; }
    const key=(l.row||'?')+'|'+(l.stack||'?');
    (cells[key]||=[]).push({b,l,id});
  });
  const noPosCount=Object.keys(noPosById).length;
  if(!cfg.length && !noPosCount) return '';
  const maxLen=cfg.length?Math.max(...cfg.map(r=>r.length)):0;

  const cellHtml = (r,s,height,cc)=>{
    cc=cc||'';
    const key=r+'|'+s; const items=cells[key];
    if(!items){ return `<div class="dcell${cc}" style="opacity:.4;border-style:dashed;cursor:default;background:transparent"></div>`; }
    const qty=items.reduce((a,x)=>a+(+x.l.qty||0),0);
    const bySort={};
    items.forEach(x=>{ const so=sortById(x.id?x.id.sortId:null); const c=so?so.color:'skoda'; bySort[c]=(bySort[c]||0)+(+x.l.qty||0); });
    const ordered=Object.entries(bySort).sort((a,b)=>b[1]-a[1]);
    const domColor=ordered[0][0];
    const nIds=(new Set(items.map(x=>x.id?x.id.id:''))).size;
    const mixed = ordered.length>1 || nIds>1;
    const cp=pig(domColor);
    const fillPct = height? Math.min(100, Math.round(qty/height*100)) : 100;
    const firstId = items[0].id;
    const label = mixed ? `${nIds} ID` : esc(firstId?firstId.code:'?');
    const size = (!mixed && items[0].b.size) ? esc(items[0].b.size) : '';
    // у змішаній стопці — смужка з кольорів усіх сортів, щоб не тапати щоразу
    const bg = ordered.length>1
      ? `linear-gradient(135deg, ${ordered.map(([c],i)=>`color-mix(in srgb, ${pig(c).c} 22%, var(--surface-2)) ${Math.round(i*100/ordered.length)}% ${Math.round((i+1)*100/ordered.length)}%`).join(', ')})`
      : `color-mix(in srgb, ${cp.c} 22%, var(--surface-2))`;
    return `<div class="dcell${cc}${mixed?' mixed':''}" style="border-color:${cp.c};background:${bg}" onclick="openCellSheet('${sh.id}','${r}','${s}')">
      <span class="glabel" style="color:${cp.b}">${label}</span>
      ${size?`<span class="gsize">${size}</span>`:''}
      <span class="gqty">${qty}</span>
    </div>`;
  };

  // ряди — стовпці (точно як на карті завезення). Зліва — нумерація стопок.
  let head='<div class="dg-col dg-nums"><div class="dg-rowhdr"></div>';
  for(let s=1;s<=maxLen;s++){ head+=`<div class="dg-snum">${s}</div>`; }
  head+='</div>';
  let cols='';
  cfg.forEach(rc=>{
    cols+=`<div class="dg-col"><div class="dg-rowhdr${rc.cross?' cross':''}">${t('row')} ${rc.n}${rc.cross?' ⟳':''}</div>`;
    for(let s=1;s<=maxLen;s++){
      const ch=stackHeight(sh, rc.n, s);
      const cc = stackRot(sh, rc.n, s)?' cross':'';
      cols+= (s<=rc.length && ch>0) ? cellHtml(String(rc.n),String(s),ch,cc) : `<div class="dcell${cc}" style="opacity:.12;border-style:dashed;cursor:default;background:transparent"></div>`;
    }
    cols+='</div>';
  });

  return `<div class="shed-grid-wrap"><div class="dig-grid-scroll" style="max-height:62vh"><div class="dig-grid-h">${head}${cols}</div></div></div>`;
}

// Вміст стопки на схемі. Тап по рядку → «Зняти зі складу» з уже вибраною стопкою.

  state.batches.forEach(b=>{ if(b.status==='sold') return; (b.locs||[]).forEach(l=>{

}

// блок статистики «викопано → склад → продано» з відсотками від викопаного
function statsBlock(dugJournal, stockBatches, soldBatches, color){
  const cp = color?pig(color):null;
  const accent = cp?cp.b:'var(--accent-hi)';
  const stockM = sizeBreakdown(stockBatches);
  const soldM = sizeBreakdown(soldBatches);
  const stockTotal = Object.values(stockM).reduce((a,b)=>a+b,0);
  const soldTotal = Object.values(soldM).reduce((a,b)=>a+b,0);
  const present = stockTotal + soldTotal;
  // якщо журнал дає менше за фактичне (старі дані без undo) — база = фактичне
  const dug = Math.max(dugJournal, present);
  const loss = dug - present;
  const pct = n => dug>0 ? Math.round(n/dug*100) : 0;
  const lines = m => Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([k,v])=>
    `<div class="sb-line"><span>${esc(k)}</span><span class="sb-q">${v}<span class="sb-pct">${pct(v)}%</span></span></div>`).join('') || `<div class="sb-line sb-empty"><span>—</span></div>`;
  const dugLabel = t('dug_from_field');
  return `<div class="stat-block">
    <div class="sb-head"><span>${dugLabel}</span><span class="sb-big" style="color:${accent}">${dug}</span></div>
    <div class="sb-section"><div class="sb-title">${t('on_stock_label')} · ${stockTotal} (${pct(stockTotal)}%)</div>${lines(stockM)}</div>
    <div class="sb-section"><div class="sb-title">${t('sold_label')} · ${soldTotal} (${pct(soldTotal)}%)</div>${lines(soldM)}</div>
    ${loss>0?`<div class="sb-section"><div class="sb-line sb-loss"><span>${t('losses')}</span><span class="sb-q">${loss}<span class="sb-pct">${pct(loss)}%</span></span></div></div>`:''}
  </div>`;
}

// рух ID за журналом: надходження, списання, відходи, сортування і з якого часу ID лежить у кожному шеді
function idLedger(idRef){
  const ops=state.ops.filter(o=>o.undo&&o.undo.idRef===idRef).sort((a,b)=>(a.ts||0)-(b.ts||0));
  const L={dug:0, writeoff:0, waste:0, digs:[], sorts:[], sortOut:{}, since:{}, ops};
  const run={};
  const bump=(sh,q,ts)=>{ if(!sh||!q) return; const b0=run[sh]||0; run[sh]=b0+q; if(b0<=0&&run[sh]>0) L.since[sh]=ts; };
  ops.forEach(o=>{ if(o.reversed) return; const u=o.undo, q=+u.qty||0;
    if(o.type==='dig'){ L.dug+=q; L.digs.push(o); bump(u.shedId,q,o.ts); }
    else if(o.type==='move'){ bump(u.fromShed,-q,o.ts); bump(u.toShed,q,o.ts); }
    else if(o.type==='sell'){ bump(u.shedId||u.fromShed,-q,o.ts); }
    else if(o.type==='writeoff'){ L.writeoff+=q; bump(u.shedId,-q,o.ts); }
    else if(o.type==='sort'){ const inp=+u.input||0, out=(u.results||[]).reduce((s,r)=>s+(+r.qty||0),0);
      const loss=u.loss!=null?+u.loss:inp-out; L.waste+=loss; L.sorts.push(o);
      (u.results||[]).forEach(r=>{ L.sortOut[r.size]=(L.sortOut[r.size]||0)+(+r.qty||0); });
      bump(u.shedId,-loss,o.ts); }
  });
  return L;
}
// де лежить ID зараз: по шедах, з розмірами, «без позиції» і «поза схемою»
function idWhere(idRef){
  const m={};
  state.batches.forEach(b=>{ if(b.idRef!==idRef||b.status==='sold') return;
    (b.locs||[]).forEach(l=>{ const q=+l.qty||0; if(q<=0) return;
      const w=(m[l.shedId||''] ||= {shedId:l.shedId||'', qty:0, sizes:{}, unplaced:0, outside:0});
      w.qty+=q; const sk=b.size||''; w.sizes[sk]=(w.sizes[sk]||0)+q;
      if(!l.row&&!l.stack) w.unplaced+=q;
      else { const sh=shedById(l.shedId); if(sh&&!posInLayout(sh,l.row,l.stack)) w.outside+=q; }
    }); });
  return Object.values(m).sort((a,b)=>b.qty-a.qty);
}

      <div class="lg-row ${L.waste?'':'dim'}"><span>${t('lg_waste')}</span><b>${L.waste}</b></div>
    </div>
    ${(L.dug||stock||sold)?`<div class="lg-check">${ L.dug===0 ? `<span class="bad">${t('lg_nojournal')}</span>`
      : diff===0 ? `<span class="ok">✓ ${t('lg_ok')}</span>`
      : `<span class="bad">${t('lg_diff')} ${diff>0?'+':''}${diff}</span> — ${t('lg_diff_hint')}`}
      ${L.digs.length?`<div class="lg-dates">${t('lg_first')} ${fmtD(L.digs[0].ts)}${(L.digs.length>1&&fmtD(L.digs[0].ts)!==fmtD(L.digs[L.digs.length-1].ts))?` · ${t('lg_last')} ${fmtD(L.digs[L.digs.length-1].ts)}`:''}${stock?` · ${t('lg_age')} ${daysText(daysSince(L.digs[0].ts))}`:''}</div>`:''}</div>`:''}
  </div>`;

  // дії
  html+=`<div class="act-row">
    <button class="btn" onclick="passBringIn('${id.id}')">${t('bring_in')}</button>
    <button class="btn" style="background:var(--danger);color:#fff" onclick="passTake('${id.id}')" ${stock?'':'disabled'}>${t('take_btn')}</button>
    ${unplaced?`<button class="btn secondary act-2l" onclick="passPlace('${id.id}')">${t('place_btn')}<small>${unplaced} ${t('no_position')}</small></button>`:''}</div>`;

  // де лежить
  if(where.length){
    html+=`<div class="pass-sec">${t('where_title')}<small>${stock} ${t('boxes')}</small></div>`;
    where.forEach(w=>{ const sh=shedById(w.shedId); const since=L.since[w.shedId];
      const parts=Object.entries(w.sizes).sort((a,b)=>b[1]-a[1]).map(([sz,q])=>`<span>${esc(sz||t('unsorted_short'))} ${q}</span>`).join('');
      html+=`<div class="where-card" ${sh?`onclick="openShed('${w.shedId}')"`:''}>
        <div class="where-top"><span class="where-name">${esc(sh?sh.name:t('iss_orphan'))}</span><span class="where-q" style="color:${p.b}">${w.qty}</span></div>
        ${since?`<div class="where-since">${t('in_shed_since')} ${fmtD(since)} · ${daysText(daysSince(since))}</div>`:''}
        <div class="where-parts">${parts}${w.unplaced?`<span class="warn-txt">${t('no_position')} ${w.unplaced}</span>`:''}${w.outside?`<span class="warn-txt">${t('outside_grid').toLowerCase()} ${w.outside}</span>`:''}</div></div>`;
    });
  } else if(!sold){ html+=emptyState(IC.box,t('id_nowhere'),t('id_nowhere_sub')); }

  // сортування
  if(L.sorts.length){
    html+=`<div class="pass-sec">${t('sorting')}<small>${L.sorts.length} ${pl(L.sorts.length,'runs_f')}</small></div><div class="box-list">`;
    [...L.sorts].reverse().forEach(o=>{ const u=o.undo, inp=+u.input||0;
      const loss=u.loss!=null?+u.loss:inp-(u.results||[]).reduce((s,r)=>s+(+r.qty||0),0);
      html+=`<div class="run"><div class="run-head"><span>${fmtD(o.ts)}${shedById(u.shedId)?' · '+esc(shedById(u.shedId).name):''}</span><span>${t('taken')} ${inp}</span></div>
        <div class="run-res">${(u.results||[]).map(r=>`<span>${esc(r.size)} <b>${r.qty}</b></span>`).join('')}${loss>0?`<span style="color:var(--text-faint)">${t('lg_waste_short')} <b>${loss}</b> · ${inp?Math.round(loss/inp*100):0}%</span>`:''}</div></div>`; });
    if(L.sorts.length>1) html+=`<div class="run-total">${t('after_sort_total')}: ${Object.entries(L.sortOut).sort((a,b)=>b[1]-a[1]).map(([sz,q])=>`<span>${esc(sz)} <b>${q}</b></span>`).join('')}</div>`;
    html+=`</div>`;
  }

  // продано
  if(sold){ const bySize={}; soldBs.forEach(b=>{ const k=b.size||''; bySize[k]=(bySize[k]||0)+batchQty(b); });
    html+=`<div class="pass-sec">${t('sold_label')}<small>${sold} ${t('boxes')}</small></div><div class="box-list">${
      Object.entries(bySize).filter(([k,q])=>q>0).sort((a,b)=>b[1]-a[1]).map(([sz,q])=>`<div class="lg-row"><span>${esc(sz||t('unsorted_short'))}</span><b>${q}</b></div>`).join('')}</div>`; }

  // історія
  const hist=[...L.ops].sort((a,b)=>(b.ts||0)-(a.ts||0));
  if(hist.length){
    const show=state.idHistAll?hist:hist.slice(0,8);
    html+=`<div class="pass-sec">${t('history_title')}<small>${hist.length}</small></div><div class="box-list">${show.map(histLine).join('')}</div>`;
    if(hist.length>show.length) html+=`<button class="more-link" onclick="state.idHistAll=true;render()">${t('show_all')} (${hist.length})</button>`;
  }
  app.innerHTML=html;
}
function histLine(op){
  const u=op.undo||{}; const q=op.type==='sort'?u.input:u.qty;
  let where='';
  if(op.type==='move') where=`${shedById(u.fromShed)?.name||'?'} → ${shedById(u.toShed)?.name||'?'}`;
  else if(op.type==='sort') where=(u.results||[]).map(r=>`${r.size} ${r.qty}`).join(', ');
  else where=shedById(u.shedId||u.fromShed)?.name||'';
  if((op.type==='dig'||op.type==='place')&&(u.placed||[]).some(p=>!p.row&&!p.stack)) where+=` · ${t('no_position')}`;
  if(u.size && op.type!=='sort') where=`${u.size}${where?' · '+where:''}`;
  const tap=!op.reversed;
  return `<div class="hist-line${tap?' tap':''}${op.reversed?' rev':''}" ${tap?`onclick="openOpActions('${op.id}')"`:''}>
    <span class="d">${fmtD(op.ts)}</span><span class="w">${t('op_'+op.type)} <span>${esc(where)}</span></span><span class="q">${q??''}</span></div>`;
}

function shedChooser(title, items){
  openSheet(`<div class="sheet-top"><h2 style="margin:0">${title}</h2><button class="sheet-x" onclick="closeSheet()">✕</button></div>
    ${items.map(it=>`<button class="btn secondary" style="margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;text-align:left" onclick="${it.act}">
      <span>${esc(shedById(it.shedId)?.name||'?')}${it.sub?` <span style="color:var(--text-faint);font-weight:600">· ${esc(it.sub)}</span>`:''}</span><span style="font-weight:700;font-size:.86rem;color:var(--text-dim)">${esc(it.right)}</span></button>`).join('')}`);

function passBringIn(idRef){
  if(!state.sheds.length){ toast(t('need_shed_first')); return; }
  const here=new Set(idWhere(idRef).map(w=>w.shedId));
  const list=[...state.sheds].sort((a,b)=>here.has(b.id)-here.has(a.id));
  shedChooser(`${t('bring_in')} · ${esc(idById(idRef)?.code||'')}`, list.map(s=>{ const free=s.capacity?Math.max(0,s.capacity-shedQty(s.id)):null;
    return {shedId:s.id, sub:here.has(s.id)?t('already_here'):'', right:free!=null?`${t('free_word')} ${free}`:'∞', act:`openDig(${ja(s.id)},${ja(idRef)})`}; }));
}
function passTake(idRef){
  const w=idWhere(idRef).filter(x=>shedById(x.shedId));
  if(!w.length){ toast(t('nothing_in_stock')); return; }
  if(w.length===1) return openTake(w[0].shedId,{idRef});
  shedChooser(t('take_title'), w.map(x=>({shedId:x.shedId, right:`${x.qty} ${t('boxes')}`, act:`openTake(${ja(x.shedId)},{idRef:${ja(idRef)}})`})));
}
function passPlace(idRef){
  const pools=[];
  state.batches.forEach(b=>{ if(b.idRef!==idRef||b.status==='sold') return; (b.locs||[]).forEach(l=>{
    if(l.row||l.stack||(+l.qty||0)<=0||!shedById(l.shedId)) return;
    const e=pools.find(p=>p.shedId===l.shedId&&p.size===(b.size||'')); if(e) e.qty+=+l.qty; else pools.push({shedId:l.shedId,size:b.size||'',qty:+l.qty}); }); });
  if(!pools.length){ toast(t('nothing_to_place')); return; }
  if(pools.length===1) return openPlace(pools[0].shedId,idRef,pools[0].size);
  shedChooser(t('place_title'), pools.map(x=>({shedId:x.shedId, sub:x.size||t('unsorted_short'), right:`${x.qty} ${t('boxes')}`, act:`openPlace(${ja(x.shedId)},${ja(idRef)},${ja(x.size)})`})));
}

function onFab(){ buzz();
  if(state.tab==='sorts'&&!state.detail) return openSortEdit();
  if(state.tab==='sorts'&&state.detail?.type==='sort') return openIdEdit(state.detail.id);

}

let _sheetHist=false, _ignorePop=false;

  if(!_sheetHist){ try{ history.pushState({kartSheet:1},''); _sheetHist=true; }catch(e){} }

// ===== Створення/редагування шеду: 2 етапи (сітка → малювання висот) =====
function openShedEdit(id){
  const sh=id?shedById(id):null;
  // стан будівника: rows, cols (maxLen), brush (поточна висота), cells {'r|s':height}
  let rows=8, cols=17, brush=0, cells={}, cross={}, rot={};
  if(sh && sh.rowsCfg){
    rows=sh.rowsCfg.length;
    cols=Math.max(...sh.rowsCfg.map(r=>r.length),1);
    sh.rowsCfg.forEach(rc=>{
      if(rc.cross) cross[rc.n]=true;
      for(let s=1;s<=rc.length;s++){
        const h=(rc.heights&&rc.heights[s-1]!=null)?rc.heights[s-1]:rc.height;
        if(h>0) cells[rc.n+'|'+s]=h;
        if(rc.rots && rc.rots[s-1]) rot[rc.n+'|'+s]=true;
      }
    });
    brush = sh.rowsCfg[0]?.height || 7;
  }
  state.shedBuild={ id:id||'', name: sh?sh.name:'', rows, cols, brush, cells, cross, rot, stage: sh?2:1, occ: id?shedOccupancy(id):{} };
  renderShedBuild();
}
function renderShedBuild(){
  const sb=state.shedBuild;
  if(sb.stage===1){
    openSheet(`<div class="sheet-top"><h2 style="margin:0">${sb.id?t('edit_shed'):t('new_shed')}</h2><button class="sheet-x" onclick="closeSheet()">✕</button></div>
      <div class="field"><label>${t('name')}</label><input id="sb-name" value="${esc(sb.name)}" placeholder="${t('shed_name_ph')}" autocomplete="off"></div>
      <p class="hint" style="margin:2px 2px 12px">${t('grid_step1_hint')}</p>
      <div class="field-row"><div class="field"><label>${t('rows_count')}</label><input id="sb-rows" type="number" inputmode="numeric" value="${sb.rows}" placeholder="8"></div>
      <div class="field"><label>${t('row_length')}</label><input id="sb-cols" type="number" inputmode="numeric" value="${sb.cols}" placeholder="17"></div></div>
      <button class="btn" onclick="shedBuildNext()">${t('next_step')} →</button>`);
    return;
  }
  // етап 2 — малювання
  openSheet(`<div class="sheet-top"><h2 style="margin:0">${esc(sb.name||t('new_shed'))}</h2><button class="sheet-x" onclick="closeSheet()">✕</button></div>
    <div class="dig-bar"><div style="display:flex;align-items:center;gap:8px"><label style="font-size:.8rem;color:var(--text-dim)">${t('brush_height')}</label>
      <input id="sb-brush" type="number" inputmode="numeric" value="${sb.brush}" style="width:58px;text-align:center;padding:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;color:var(--accent-hi);font-weight:800;font-size:1.05rem" oninput="sbSetBrush(this.value)">
      <button class="btn" style="width:auto;padding:8px 16px;margin:0" onpointerdown="event.preventDefault();sbFillAll()">${t('fill_all')}</button></div>
      <button class="btn" style="width:auto;padding:9px 20px;margin:0;background:var(--accent);color:#06180a" onclick="saveShedBuild()">${t('create_shed')}</button></div>
    <p class="hint" style="margin:2px 2px 8px">${sb.rotMode?t('rot_hint'):t('grid_step2_hint2')}</p>
    <button class="btn secondary" id="sb-rotbtn" style="margin:0 0 10px;${sb.rotMode?'border-color:var(--move);color:var(--move)':''}" onclick="sbToggleRotMode()">${sb.rotMode?t('rot_mode_on'):t('rot_mode_off')}</button>
    <div id="sb-warn" class="warn-box"></div>
    <div id="sb-cap" class="dig-total" style="margin:0 2px 10px"></div>
    <div id="sb-map">${shedBuildMapHtml()}</div>
    <button class="btn ghost" style="margin-top:12px" onclick="shedBuildBack()">← ${t('grid_resize')}</button>
    ${sb.id?`<button class="btn ghost" data-armed="0" onclick="confirmDelShed(this,'${sb.id}')" style="color:var(--danger)">${t('delete_shed')}</button>`:''}`, true);
  updSbCap();
}
function sbToggleRotMode(){ sbFlushPending(); const sb=state.shedBuild; sb.rotMode=!sb.rotMode; renderShedBuild(); }
function sbFillAll(){
  sbFlushPending();
  const sb=state.shedBuild;
  const bi=document.getElementById('sb-brush');
  const h=bi?Math.max(0,Math.min(99,parseInt(bi.value,10)||0)):sb.brush;
  sb.brush=h;
  if(h<=0){ sb.cells={}; }   // 0 — очистити весь шед
  else { for(let r=1;r<=sb.rows;r++) for(let s=1;s<=sb.cols;s++) sb.cells[r+'|'+s]=h; }
  document.getElementById('sb-map').innerHTML=shedBuildMapHtml(); updSbCap();
}
function shedBuildNext(){
  const sb=state.shedBuild;
  sb.name=document.getElementById('sb-name').value.trim();
  if(!sb.name){ toast(t('enter_name')); return; }
  sb.rows=Math.max(1,Math.min(40,+document.getElementById('sb-rows').value||8));
  sb.cols=Math.max(1,Math.min(40,+document.getElementById('sb-cols').value||17));
  // обрізати все, що вийшло за нову сітку (інакше місткість рахує зайве)
  const outK=k=>{ const [r,c]=k.split('|').map(Number); return r>sb.rows||c>sb.cols; };
  Object.keys(sb.cells).forEach(k=>{ if(outK(k)) delete sb.cells[k]; });
  Object.keys(sb.rot).forEach(k=>{ if(outK(k)) delete sb.rot[k]; });
  Object.keys(sb.cross).forEach(r=>{ if(+r>sb.rows) delete sb.cross[r]; });
  sb.stage=2; renderShedBuild();
}
function shedBuildBack(){ sbFlushPending(); state.shedBuild.stage=1; renderShedBuild(); }
function sbSetBrush(v){ state.shedBuild.brush=Math.max(0,Math.min(99,parseInt(v,10)||0)); }
function shedBuildMapHtml(){
  const sb=state.shedBuild;
  let head='<div class="dg-col dg-nums"><div class="dg-rowhdr"></div>';
  for(let s=1;s<=sb.cols;s++){ head+=`<div class="dg-snum">${s}</div>`; }
  head+='</div>';
  let cols='';
  for(let r=1;r<=sb.rows;r++){
    const isCross=!!sb.cross[r];
    cols+=`<div class="dg-col"><div class="dg-rowhdr rowhdr-tap${isCross?' cross':''}" onclick="sbToggleCross(${r})">${t('row')} ${r}${isCross?' ⟳':''}</div>`;
    for(let s=1;s<=sb.cols;s++){
      const k=r+'|'+s; const h=sb.cells[k];
      const g=`onpointerdown="sbDown(event,'${k}')" onpointerup="sbUp(event,'${k}')" onpointermove="sbMove(event)" onpointercancel="sbCancel()" oncontextmenu="return false"`;
      const crossCls=(isCross||sb.rot[k])?' cross':'';
      const ob=sbOccBadge(k);
      if(h>0){ cols+=`<div class="dcell filled${crossCls}" data-cell="${k}" ${g}><span class="dpick" style="color:var(--accent-hi)">${h}</span>${ob}</div>`; }
      else { cols+=`<div class="dcell${crossCls}" data-cell="${k}" style="opacity:.45;border-style:dashed" ${g}>${ob}</div>`; }
    }
    cols+='</div>';
  }
  return `<div class="dig-grid-scroll" style="max-height:54vh"><div class="dig-grid-h">${head}${cols}</div></div>`;
}
// скільки ящиків уже лежить у стопці (під час редагування існуючого шеду)
function sbOccBadge(k){ const sb=state.shedBuild; const o=sb.occ&&sb.occ[k]; if(!o||!(o.qty>0)) return '';
  const h=sb.cells[k]||0; return `<span class="docc${h<o.qty?' bad':''}">${o.qty}</span>`; }
function sbToggleCross(r){
  sbFlushPending();
  const sb=state.shedBuild;
  if(sb.cross[r]) delete sb.cross[r];
  else { sb.cross[r]=true; Object.keys(sb.rot).forEach(k=>{ if(+k.split('|')[0]===r) delete sb.rot[k]; }); } // ряд повернуто цілком
  document.getElementById('sb-map').innerHTML=shedBuildMapHtml(); buzz(10);
}
// Жести: одиночний тап = пензель; подвійний швидкий = клавіатура+новий пензель; довге = вимкнути.
// У режимі обертання діє лише одиночний тап, і він спрацьовує одразу.
let sbGest={ k:null, t:0, longTimer:null, pendingTimer:null, pendingK:null, lastK:null, lastT:0 };
function sbDown(e, k){
  if(e.target && e.target.classList.contains('dq')) return; // у полі вводу — не чіпати
  sbGest.k=k; sbGest.down=Date.now(); sbGest.long=false;
  sbGest.sx=e.clientX; sbGest.sy=e.clientY;
  clearTimeout(sbGest.longTimer);
  if(state.shedBuild.rotMode) return;   // обертання: жодних довгих натискань, щоб не знищити стопку
  sbGest.longTimer=setTimeout(()=>{ sbGest.long=true; sbDisableCell(k); buzz(20); }, 480);
}
function sbMove(e){
  if(sbGest.sx==null)return;
  if(Math.abs(e.clientX-sbGest.sx)>10 || Math.abs(e.clientY-sbGest.sy)>10){ clearTimeout(sbGest.longTimer); sbGest.k=null; sbGest.sx=null; }
}
function sbUp(e, k){
  clearTimeout(sbGest.longTimer);
  if(sbGest.sx==null){ return; } // скрол — ігнорувати
  sbGest.sx=null;
  if(sbGest.long){ sbGest.long=false; return; } // довге вже відпрацювало
  if(state.shedBuild.rotMode){ sbRotateCell(k); return; }   // обертання — без затримки й без подвійних тапів
  const now=Date.now();
  // тап по ІНШІЙ стопці: спершу застосувати попередній, інакше він губиться
  if(sbGest.pendingK && sbGest.pendingK!==k) sbFlushPending();
  if(sbGest.lastK===k && (now-sbGest.lastT)<320){
    sbGest.lastK=null; sbGest.lastT=0;
    clearTimeout(sbGest.pendingTimer); sbGest.pendingK=null;
    sbEditCell(k); return;
  }
  sbGest.lastK=k; sbGest.lastT=now; sbGest.pendingK=k;
  clearTimeout(sbGest.pendingTimer);
  sbGest.pendingTimer=setTimeout(()=>{ sbGest.pendingK=null; sbGest.lastK=null; sbApplyBrush(k); }, 230);
}
// застосувати відкладений тап негайно (перед іншою дією), щоб жоден тап не пропав
function sbFlushPending(){ if(!sbGest.pendingK) return; clearTimeout(sbGest.pendingTimer);
  const k=sbGest.pendingK; sbGest.pendingK=null; sbGest.lastK=null; sbApplyBrush(k); }
function sbCancel(){ clearTimeout(sbGest.longTimer); sbGest.long=false; }
// обертання однієї стопки
function sbRotateCell(k){
  const sb=state.shedBuild;
  if(!sb.cells[k]){ toast(t('rot_need_stack')); return; }
  const r=+k.split('|')[0];
  if(sb.cross[r]){ toast(t('rot_row_on')); return; }   // ряд повернуто цілком — спершу зніми його
  if(sb.rot[k]) delete sb.rot[k]; else sb.rot[k]=true;
  sbRepaintCell(k); buzz(10);
}
function sbApplyBrush(k){
  const sb=state.shedBuild;
  if(sb.rotMode){ sbRotateCell(k); return; }
  const bi=document.getElementById('sb-brush'); if(bi) sb.brush=Math.max(0,Math.min(99,parseInt(bi.value,10)||0));
  if(sb.brush<=0){ delete sb.cells[k]; } else { sb.cells[k]=sb.brush; }
  sbRepaintCell(k); updSbCap();
}
function sbDisableCell(k){ const sb=state.shedBuild; delete sb.cells[k]; sb.sbEditing=null; sbRepaintCell(k); updSbCap(); }
function sbEditCell(k){
  const sb=state.shedBuild; sb.sbEditing=k;
  const cell=document.querySelector(`.dcell[data-cell="${k}"]`); if(!cell)return;
  cell.className='dcell filled'; cell.style.opacity=''; cell.style.borderStyle='';
  cell.innerHTML=`<input class="dq" inputmode="numeric" value="${sb.cells[k]||sb.brush}" data-k="${k}" oninput="sbCellInput('${k}',this.value)" onblur="sbCellBlur('${k}')">`;
  const el=cell.querySelector('.dq'); if(el){el.focus();el.select();}
}
function sbCellInput(k,val){ const n=parseInt(val,10); const sb=state.shedBuild; if(!isNaN(n)&&n>0){ sb.cells[k]=Math.min(99,n); sb.brush=sb.cells[k]; const bi=document.getElementById('sb-brush'); if(bi)bi.value=sb.brush; } else sb.cells[k]=0; updSbCap(); }
function sbCellBlur(k){ const sb=state.shedBuild; sb.sbEditing=null; if(!sb.cells[k]) delete sb.cells[k]; sbRepaintCell(k); updSbCap(); }
function sbRepaintCell(k){
  const sb=state.shedBuild; const cell=document.querySelector(`.dcell[data-cell="${k}"]`); if(!cell)return;
  const r=+k.split('|')[0]; const cc=(sb.cross[r]||sb.rot[k])?' cross':'';
  const h=sb.cells[k];
  if(h>0){ cell.className='dcell filled'+cc; cell.style.opacity=''; cell.style.borderStyle=''; cell.innerHTML=`<span class="dpick" style="color:var(--accent-hi)">${h}</span>${sbOccBadge(k)}`; }
  else { cell.className='dcell'+cc; cell.style.opacity='.45'; cell.style.borderStyle='dashed'; cell.innerHTML=sbOccBadge(k); }
}
function sbCapacity(){ return Object.values(state.shedBuild.cells).reduce((a,b)=>a+(+b||0),0); }
function updSbCap(){ const el=document.getElementById('sb-cap'); if(!el)return; const cap=sbCapacity(); const n=Object.keys(state.shedBuild.cells).length; el.innerHTML=`${t('capacity_label')}: <b>${cap}</b> ${t('boxes')} · ${n} ${pl(n,'stacks_f')}`; }
async function saveShedBuild(){
  sbFlushPending();
  const sb=state.shedBuild;
  if(sb.sbEditing){ const k=sb.sbEditing; const el=document.querySelector(`.dq[data-k="${k}"]`); if(el) sbCellInput(k, el.value); sb.sbEditing=null; }
  if(!sbCapacity()){ toast(t('grid_empty')); return; }
  // не дати прибрати або вкоротити стопку, в якій лежать ящики
  if(sb.id){
    const old=shedById(sb.id); const probs=[];
    Object.entries(sb.occ||{}).forEach(([k,o])=>{
      if(!(o.qty>0)) return; const [r,c]=k.split('|'); if(!r&&!c) return;
      if(!old||!posInLayout(old,r,c)) return;               // уже була поза схемою — не блокує
      const h=(+r<=sb.rows && +c<=sb.cols)?(sb.cells[k]||0):0;
      if(h<=0) probs.push(`${posLabel(r,c)}: ${o.qty} ${t('boxes')} — ${t('stack_removed')}`);
      else if(o.qty>h) probs.push(`${posLabel(r,c)}: ${o.qty} ${t('boxes')} > ${t('height').toLowerCase()} ${h}`);
    });
    if(probs.length){
      const w=document.getElementById('sb-warn');
      if(w){ w.innerHTML=`<b>${t('shed_blocked')}</b><br>${probs.slice(0,6).map(esc).join('<br>')}${probs.length>6?`<br>+${probs.length-6}`:''}<br>${t('shed_blocked_hint')}`; w.scrollIntoView({block:'nearest',behavior:'smooth'}); }
      buzz([40,60,40]); return;
    }
  }
  // зібрати rowsCfg із heights[] по кожному ряду; length = остання активна стопка ряду
  const rowsCfg=[];
  for(let r=1;r<=sb.rows;r++){
    let maxStack=0; const heights=[]; const rots=[];
    for(let s=1;s<=sb.cols;s++){ const h=sb.cells[r+'|'+s]||0; heights[s-1]=h; rots[s-1]=sb.rot[r+'|'+s]?1:0; if(h>0) maxStack=s; }
    if(maxStack>0){
      const trimmed=heights.slice(0,maxStack);
      const trimmedRots=rots.slice(0,maxStack);
      const uniform = trimmed.every(h=>h===trimmed[0]);
      const anyRot = trimmedRots.some(x=>x);
      rowsCfg.push({ n:r, length:maxStack, height: uniform?trimmed[0]:(trimmed.find(h=>h>0)||0), heights: uniform?null:trimmed, cross: !!sb.cross[r], rots: (anyRot && !sb.cross[r])?trimmedRots:null });
    }
  }
  const capacity=sbCapacity();
  const obj={ ...(sb.id?shedById(sb.id):{}), id:sb.id||db.newShed(), name:sb.name, rowsCfg, capacity, mts:Date.now() };
  await db.saveShed(obj); await reload(); closeSheet(); buzz(20); toast(t('shed_saved'));
  state.shedBuild=null;
  if(state.detail?.type==='shed') state.detail.id=obj.id; render();
}
function confirmDelShed(btn,id){
  const hasBoxes=state.batches.some(b=>b.status!=='sold' && (b.locs||[]).some(l=>l.shedId===id && (+l.qty||0)!==0));
  if(hasBoxes){ toast(t('del_shed_not_empty')); return; }
  if(btn.dataset.armed==='1'){doDelShed(id);return;}
  btn.dataset.armed='1'; btn.textContent=t('confirm_again'); btn.classList.add('confirm-armed');
  setTimeout(()=>{if(btn){btn.dataset.armed='0';btn.textContent=t('delete_shed');btn.classList.remove('confirm-armed');}},4000);
}
async function doDelShed(id){ await db.delShed(id); await reload(); closeSheet(); buzz(20); toast(t('shed_deleted')); go('sheds'); }

// ---- Фізична зайнятість стопок ----
// мапа зайнятості шеду: key 'row|stack' -> {qty (всього), items:[{idRef,size,qty}]}
function shedOccupancy(shedId){
  const occ={};
  state.batches.filter(b=>b.status!=='sold').forEach(b=>{
    (b.locs||[]).forEach(l=>{ if(l.shedId===shedId && (+l.qty||0)>0){
      const k=(l.row||'')+'|'+(l.stack||'');
      if(!occ[k]) occ[k]={qty:0, items:[]};
      occ[k].qty += (+l.qty||0);
      occ[k].items.push({idRef:b.idRef, size:b.size||'', qty:(+l.qty||0)});
    }});
  });
  return occ;
}
function rowCfg(sh, rowN){ return (sh.rowsCfg||[]).find(r=>r.n===+rowN); }
// висота конкретної стопки (підтримує heights[] або єдину height)
function stackHeight(sh, rowN, stack){
  const rc=rowCfg(sh, rowN); if(!rc) return 0;
  if(rc.heights && rc.heights[stack-1]!=null) return rc.heights[stack-1];
  return rc.height||0;
}
// чи повернена окрема стопка (поперечна)
function stackRot(sh, rowN, stack){
  const rc=rowCfg(sh, rowN); if(!rc) return false;
  if(rc.cross) return true;
  return !!(rc.rots && rc.rots[stack-1]);
}

// ---- ОПЕРАЦІЇ ЗАДНІМ ЧИСЛОМ ----
// state.backdate — обрана дата (лише до перезапуску). Кожна наступна операція отримує її (+1 с на операцію,
// щоб зберегти порядок), а поле entered пам'ятає, коли запис насправді внесено.
function toLocalInput(ts){ const d=new Date(ts), p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; }
function whenRowHtml(){
  const bd=state.backdate;
  return `<div class="when-row${bd?' past':''}" id="when-row"><span class="when-lbl">${t('when_label')}</span>
    <label class="when-btn">${bd?esc(fmtDT(bd)):t('when_now')}<input type="datetime-local" value="${toLocalInput(bd||Date.now())}" max="${toLocalInput(Date.now())}" onchange="setWhen(this.value)"></label>
    ${bd?`<button class="when-x" onclick="setWhen('')" aria-label="${t('when_now')}">✕</button>`:''}</div>`;
}
function setWhen(v){
  if(!v){ state.backdate=null; }
  else { const ts=new Date(v).getTime(); if(isNaN(ts)) return;
    if(ts>Date.now()+60000){ toast(t('when_future'),true); state.backdate=null; }
    else if(Date.now()-ts<120000){ state.backdate=null; }
    else { state.backdate=ts; state.backdateSeq=0; } }
  const r=document.getElementById('when-row'); if(r) r.outerHTML=whenRowHtml();
  updBdPill(); buzz(8);
}
function opTs(){ if(!state.backdate) return Date.now(); state.backdateSeq=(state.backdateSeq||0)+1; return state.backdate+state.backdateSeq*1000; }
function updBdPill(){ const el=document.getElementById('bd-pill'); if(!el) return;
  if(!state.backdate){ el.hidden=true; el.innerHTML=''; return; }
  el.hidden=false; el.innerHTML=`<span>${t('bd_active')}: <b>${esc(fmtDT(state.backdate))}</b></span><button onclick="setWhen('')" aria-label="${t('when_now')}">✕</button>`; }
// дата не може бути ранішою, ніж цей ID (цього розміру) потрапив у шед
function whenOk(idRef, size, shedId){
  const bd=state.backdate; if(!bd) return true;
  let first=Infinity; const sz=size||'';
  state.ops.forEach(o=>{ if(o.reversed||!o.undo||o.undo.idRef!==idRef) return; const u=o.undo;
    const adds=(o.type==='dig'&&u.shedId===shedId&&(u.size||'')===sz)
      ||(o.type==='move'&&u.toShed===shedId&&(u.size||'')===sz)
      ||(o.type==='sort'&&u.shedId===shedId&&(u.results||[]).some(r=>(r.size||'')===sz));
    if(adds&&o.ts<first) first=o.ts; });
  if(first<Infinity && bd<first){ toast(`${t('when_before_arrival')} ${fmtDT(first)}`,true); buzz([40,60,40]); return false; }
  return true;
}

// ---- Завезення: по стопках (карта) або просто кількістю (без позиції) ----
function openDig(shedId, idRef){
  if(!state.ids.length){toast(t('need_sort_id_first'));return;}
  const sh=shedById(shedId); if(!sh) return;
  const hasMap=!!(sh.rowsCfg&&sh.rowsCfg.length);
  let mode=localStorage.getItem('kart_dig_mode')==='qty'?'qty':'map'; if(!hasMap) mode='qty';
  // який ID підставити: переданий → останній завезений → перший
  const lastDig=state.ops.filter(o=>o.type==='dig'&&!o.reversed&&o.undo&&idById(o.undo.idRef)).sort((a,b)=>b.ts-a.ts)[0];
  const pick=(idRef&&idById(idRef))?idRef:(lastDig?lastDig.undo.idRef:state.ids[0].id);
  state.digMap={ shedId, idRef:pick, draft:{}, mode, qty:0, hasMap };
  renderDigSheet();
}
function digSetMode(m){ const dm=state.digMap; if(!dm||(m==='map'&&!dm.hasMap)) return; dm.mode=m; localStorage.setItem('kart_dig_mode',m); renderDigSheet(); }

      <div class="dig-bar"><span id="dig-total" class="dig-total"></span><button class="btn" style="width:auto;padding:9px 22px;margin:0" onclick="saveDig()">${t('place_btn')}</button></div>

  const seg=`<div class="seg seg-sm" style="margin:0 0 12px"><button class="${dm.mode==='map'?'on':''}" ${dm.hasMap?'':'disabled'} onclick="digSetMode('map')">${t('dig_mode_map')}</button><button class="${dm.mode==='qty'?'on':''}" onclick="digSetMode('qty')">${t('dig_mode_qty')}</button></div>`;
  const top=`<div class="sheet-top"><h2 style="margin:0">${t('dig_to')} → ${esc(sh.name)}</h2><button class="sheet-x" onclick="closeSheet()">✕</button></div>`;

        <input id="dq-total" inputmode="numeric" value="${dm.qty||''}" placeholder="0" oninput="digQtyInput(this.value)">
        <button class="qstep" onclick="digQtyStep(1)">+1</button><button class="qstep" onclick="digQtyStep(10)">+10</button></div>
      <p id="dq-info" class="qty-info"></p>
      ${whenRowHtml()}
      <button class="btn" onclick="saveDig()">${t('bring_in')}</button>
      <p class="hint" style="margin:10px 2px 0">${t('dig_qty_hint')}${dm.hasMap?'':' '+t('dig_no_map_hint')}</p>`);
    updDigQtyInfo();
    return;
  }
  openSheet(`${top}${idSel}${seg}${whenRowHtml()}
    <div class="dig-bar"><span id="dig-total" class="dig-total"></span><button class="btn" style="width:auto;padding:9px 22px;margin:0" onclick="saveDig()">${t('bring_in')}</button></div>
    <p class="hint" style="margin:2px 2px 10px">${t('dig_map_hint')}</p>
