function digSetId(v){ state.digMap.idRef=v; const m=document.getElementById('dig-map'); if(m) m.innerHTML=digMapHtml(); updDigTotal(); }
function digQtyInput(v){ const n=parseInt(v,10); state.digMap.qty=(isNaN(n)||n<0)?0:n; updDigQtyInfo(); }
function digQtyStep(d){ const dm=state.digMap; dm.qty=Math.max(0,(+dm.qty||0)+d); const el=document.getElementById('dq-total'); if(el) el.value=dm.qty||''; updDigQtyInfo(); buzz(8); }
function updDigQtyInfo(){
  const el=document.getElementById('dq-info'); if(!el) return; const dm=state.digMap; const sh=shedById(dm.shedId);
  const free=sh.capacity?Math.max(0,sh.capacity-shedQty(sh.id)):null; const n=+dm.qty||0, over=free!=null&&n>free;
  el.className='qty-info'+(over?' over':'');
  el.innerHTML = free==null ? t('dig_qty_nocap') : `${t('free_in_shed')}: <b>${free}</b>${over?` — ${t('over_capacity')}`:''}`;
}
function digMapHtml(){
  const dm=state.digMap; const sh=shedById(dm.shedId);
  const occ=shedOccupancy(dm.shedId);
  const myId=dm.idRef;
  const maxLen=Math.max(...sh.rowsCfg.map(r=>r.length));
  // Заголовки рядів + стовпці. Зліва — нумерація стопок.
  let head='<div class="dg-col dg-nums"><div class="dg-rowhdr"></div>';
  for(let s=1;s<=maxLen;s++){ head+=`<div class="dg-snum">${s}</div>`; }
  head+='</div>';
  let cols='';
  sh.rowsCfg.forEach(rc=>{
    cols+=`<div class="dg-col"><div class="dg-rowhdr${rc.cross?' cross':''}">${t('row')} ${rc.n}${rc.cross?' ⟳':''}</div>`;
    for(let s=1;s<=maxLen;s++){
      if(s>rc.length){ cols+=`<div class="dcell void"></div>`; continue; }
      const k=rc.n+'|'+s;
      const cellH=stackHeight(sh, rc.n, s);
      if(cellH<=0){ cols+=`<div class="dcell void"></div>`; continue; }  // вимкнена стопка
      const cc = stackRot(sh, rc.n, s)?' cross':'';
      const occCell=occ[k];
      const draftV=dm.draft[k];
      const totalHere = occCell?occCell.qty:0;       // вже лежить (усі ID разом)
      const mySize = dm.placeMode ? (dm.size||'') : '';
      const myHere = occCell?occCell.items.filter(x=>x.idRef===myId && x.size===mySize).reduce((a,x)=>a+x.qty,0):0;
      const free = cellH - totalHere;             // вільне місце (незалежно від ID)
      // домінантний колір для підсвітки зайнятого
      let cp=null, otherTag='';
      if(occCell){
        const bySort={};
        occCell.items.forEach(x=>{ const so=sortById(idById(x.idRef)?.sortId); const c=so?so.color:'skoda'; bySort[c]=(bySort[c]||0)+x.qty; });
        const domColor=Object.entries(bySort).sort((a,b)=>b[1]-a[1])[0][0];
        cp=pig(domColor);
        const otherQty = totalHere - myHere;
        if(otherQty>0) otherTag=`<span class="dother" style="color:${cp.b}">${otherQty}</span>`;
      }
      if(free<=0){ // стопка повна (будь-якими ID)
        cols+=`<div class="dcell full${cc}" data-cell="${k}" title="${t('stack_full')}" ${cp?`style="--c:${cp.c}"`:''}><span class="dlock">${totalHere}</span><span class="dcap">${cellH}</span></div>`;
        continue;
      }
      const filled = draftV!=null;
      const editing = dm.editing===k;
      // плашка показує: чуже (otherTag) + моє вже (myHere) як база для доливання
      const baseTag = (myHere||otherTag) ? `<span class="dbase">${myHere?('+'+myHere):''}</span>${otherTag}` : '';
      let inner;
      if(editing){ inner=`<input class="dq" inputmode="numeric" value="${draftV!=null?draftV:free}" data-k="${k}" data-max="${free}" oninput="digCellInput('${k}',this.value,${free})">`; }
      else if(filled){ inner=`<span class="dpick" style="color:var(--accent-hi)">${draftV}</span>`; }
      else { inner=`<span class="dadd">${myHere?myHere:''}</span>`; }
      cols+=`<div class="dcell${filled?' filled':''}${(myHere||totalHere)?' mine':''}${cc}" data-cell="${k}" ${cp?`style="--c:${cp.c}"`:''} onclick="if(event.target.tagName!=='INPUT')digCellTap('${k}',${free})">${baseTag}${inner}<span class="dcap">${cellH}</span></div>`;
    }
    cols+='</div>';
  });
  return `<div class="dig-grid-scroll"><div class="dig-grid-h">${head}${cols}</div></div>`;
}
function digRemainingPool(excludeK){
  const dm=state.digMap; if(!dm.placeMode) return Infinity;
  let used=0; Object.entries(dm.draft).forEach(([k,v])=>{ if(k!==excludeK) used+=(+v||0); });
  return Math.max(0, dm.pool - used);
}
function digCellTap(k, free){
  const dm=state.digMap;
  const cap = dm.placeMode ? Math.min(free, digRemainingPool(k)) : free;
  const cell=document.querySelector(`.dcell[data-cell="${k}"]`);
  if(dm.draft[k]==null){
    if(cap<=0){ toast(t('pool_empty')); return; }
    dm.draft[k]=Math.max(1,cap); dm.editing=null;
    if(cell){ cell.classList.add('filled'); const span=cell.querySelector('.dadd,.dpick');
      if(span){ span.className='dpick'; span.style.color='var(--accent-hi)'; span.textContent=dm.draft[k]; }
      else { const cap2=cell.querySelector('.dcap'); const sp=document.createElement('span'); sp.className='dpick'; sp.style.color='var(--accent-hi)'; sp.textContent=dm.draft[k]; cell.insertBefore(sp, cap2); } }
    updDigTotal();
    return;
  }
  if(dm.editing!==k){
    dm.editing=k;
    if(cell){ const span=cell.querySelector('.dadd,.dpick'); const html=`<input class="dq" inputmode="numeric" value="${dm.draft[k]}" data-k="${k}" data-max="${cap}" oninput="digCellInput('${k}',this.value,${free})">`;
      if(span) span.outerHTML=html; const el=cell.querySelector('.dq'); if(el){el.focus();el.select();} }
    return;
  }
  delete dm.draft[k]; dm.editing=null;
  if(cell){ cell.classList.remove('filled'); const inp=cell.querySelector('.dq'); const html=`<span class="dadd"></span>`; if(inp) inp.outerHTML=html; else { const sp=cell.querySelector('.dpick'); if(sp){sp.className='dadd';sp.style.color='';sp.textContent='';} } }
  updDigTotal();
}
function digCellInput(k, val, free){
  const dm=state.digMap; let n=parseInt(val,10);
  const cap = dm.placeMode ? Math.min(free, digRemainingPool(k)) : free;
  if(isNaN(n)||n<=0){ dm.draft[k]=0; }
  else { if(n>cap){ n=cap; const el=document.querySelector(`.dq[data-k="${k}"]`); if(el)el.value=n; } dm.draft[k]=n; }
  updDigTotal();
}
function digTotalQty(){ return Object.values(state.digMap.draft).reduce((a,b)=>a+(+b||0),0); }
function digStackCount(){ return Object.values(state.digMap.draft).filter(v=>+v>0).length; }
function updDigTotal(){
  const el=document.getElementById('dig-total'); if(!el)return;
  const n=digTotalQty(); const stacks=digStackCount();
  if(state.digMap.placeMode){
    const left=state.digMap.pool-n;
    el.innerHTML = `<b style="${n>state.digMap.pool?'color:var(--danger)':''}">${n}</b> / ${state.digMap.pool} · ${t('left_word')} ${left>=0?left:0}`;
    return;
  }
  el.innerHTML = n? `<b>${n}</b> ${t('boxes')} · ${stacks} ${pl(stacks,'stacks_f')}` : t('dig_tap_to_start');
}
// ---- Розкладання безпозиційної кількості по стопках ----
function noPosQtyFor(shedId, idRef, size){
  let q=0;
  state.batches.filter(b=>b.status!=='sold'&&b.idRef===idRef&&(b.size||'')===(size||'')).forEach(b=>{
    (b.locs||[]).forEach(l=>{ if(l.shedId===shedId && !l.row && !l.stack) q+=(+l.qty||0); });
  });
  return q;
}
function openPlace(shedId, idRef, size){
  const sh=shedById(shedId); if(!sh) return;
  if(!sh.rowsCfg||!sh.rowsCfg.length){ toast(t('shed_no_rows')); return; }
  const pool=noPosQtyFor(shedId, idRef, size);
  if(pool<=0){ toast(t('nothing_to_place')); return; }
  // та сама карта, що й завезення, але в межах того, що лежить без позиції
  state.digMap={ shedId, idRef, size:size||'', draft:{}, placeMode:true, pool };
  renderDigSheet();
}
async function saveDig(){
  const dm=state.digMap; const shedId=dm.shedId, idRef=dm.idRef;
  if(!dm.placeMode && dm.mode==='qty'){                       // кількістю: у шед без позиції
    const n=+dm.qty||0; if(n<=0){ toast(t('dig_nothing')); return; }
    const sh=shedById(shedId), idObj=idById(idRef);
    const ok=await runOp(d=>{ d.add(idRef,'','shed',shedId,'','',n);
      return {id:db.newOp(),ts:opTs(),entered:Date.now(),type:'dig',title:'dig',detail:`${idObj?idObj.code:'?'} → ${sh?sh.name:'?'}`,
        undo:{idRef,size:'',shedId,placed:[{row:'',stack:'',qty:n}],qty:n}}; }, `+${n} ${t('boxes')} · ${t('no_position')}`);
    if(ok){ state.digMap=null; closeSheet(); render(); }
    return;
  }
  const total=digTotalQty();
  if(total<=0){ toast(t('dig_nothing')); return; }
  const placed=Object.entries(dm.draft).filter(([k,v])=>+v>0).map(([k,v])=>{ const [row,stack]=k.split('|'); return {row,stack,qty:+v}; });
  const place=!!dm.placeMode, size=place?(dm.size||''):'';
  if(place && total>dm.pool){ toast(t('over_pool'),true); return; }
  if(place && !whenOk(idRef,size,shedId)) return;
  const sh=shedById(shedId), idObj=idById(idRef);
  const ok=await runOp(d=>{
    if(place) d.remove(idRef,size,'shed',shedId,'','',total);   // розкладання: сума не росте, лише переходить на стопки
    placed.forEach(p=>d.add(idRef,size,'shed',shedId,p.row,p.stack,p.qty));
    return {id:db.newOp(),ts:opTs(),entered:Date.now(),type:place?'place':'dig',title:place?'place':'dig',
      detail:`${idObj?idObj.code:'?'} → ${sh?sh.name:'?'}`, undo:{idRef,size,shedId,placed,qty:total}};
  }, place?`${t('placed_done')} ${total}`:`+${total} ${t('boxes')}`);
  if(!ok) return;
  state.digMap=null; closeSheet(); render();
}

// ---- ЗНЯТТЯ ЗІ СКЛАДУ: карта стопок → продаж / переміщення / сортування / списання ----
// pre = {idRef,size,key} — відкрити з уже вибраною стопкою (зі схеми або «Поза схемою»)
function openTake(shedId, pre){
  const sh=shedById(shedId); if(!sh) return;
  const present={};
  state.batches.filter(b=>b.status!=='sold').forEach(b=>{
    if((b.locs||[]).some(l=>l.shedId===shedId&&(+l.qty||0)>0)){ const k=b.idRef+'\u0001'+(b.size||''); present[k]={idRef:b.idRef,size:b.size||''}; }
  });
  const code=o=>idById(o.idRef)?.code||'';
  const opts=Object.values(present).sort((a,b)=>code(a).localeCompare(code(b),'uk',{numeric:true})||a.size.localeCompare(b.size,'uk',{numeric:true}));
  if(!opts.length){ toast(t('shed_empty')); return; }
  let si=0; if(pre){ const i=opts.findIndex(o=>o.idRef===pre.idRef&&(pre.size==null||o.size===(pre.size||''))); if(i>=0) si=i; }
  state.takeMap={ shedId, opts, si, draft:{}, editing:null };
  if(pre&&pre.key){ const h=takeHave(); const have=pre.key==='|'?h.pool:(h.m[pre.key]||0); if(have>0) state.takeMap.draft[pre.key]=have; }
  renderTakeSheet();
}
const takeSel=()=>state.takeMap.opts[state.takeMap.si];
// що з обраного ID+розміру лежить у цьому шеді: по стопках (m) і без позиції (pool)
function takeHave(){
  const tm=state.takeMap, o=takeSel(); const m={}; let pool=0;
  state.batches.filter(b=>b.status!=='sold'&&b.idRef===o.idRef&&(b.size||'')===o.size).forEach(b=>(b.locs||[]).forEach(l=>{
    if(l.shedId!==tm.shedId) return; const q=+l.qty||0; if(q<=0) return;
    if(!l.row&&!l.stack) pool+=q; else { const k=l.row+'|'+l.stack; m[k]=(m[k]||0)+q; }
  }));
  return {m,pool};
}
function renderTakeSheet(){
  const tm=state.takeMap; const sh=shedById(tm.shedId);
  const optHtml=tm.opts.map((o,i)=>{ const id=idById(o.idRef); const so=sortById(id?id.sortId:null);
    return `<option value="${i}" ${i===tm.si?'selected':''}>${esc(id?id.code:'?')} — ${esc(so?so.name:'?')}${o.size?' · '+esc(o.size):' · '+t('unsorted_short')}</option>`;
  }).join('');
  openSheet(`<div class="sheet-top"><h2 style="margin:0">${t('take_title')} → ${esc(sh.name)}</h2><button class="sheet-x" onclick="closeSheet()">✕</button></div>
    <div class="field"><label>${t('what_take')}</label><select id="tk-sel" onchange="takeSetSel(+this.value)">${optHtml}</select></div>
    <div class="dig-bar"><span id="take-total" class="dig-total"></span><button class="btn" style="width:auto;padding:9px 22px;margin:0;background:var(--danger);color:#fff" onclick="takeProceed()">${t('next_step')}</button></div>
    <p class="hint" style="margin:2px 2px 10px">${t('take_hint')}</p>
    <div id="take-map">${takeMapHtml()}</div>`, true);
  updTakeTotal();
}
function takeSetSel(i){ const tm=state.takeMap; tm.si=i; tm.draft={}; tm.editing=null; document.getElementById('take-map').innerHTML=takeMapHtml(); updTakeTotal(); }
function takeCellHtml(k, have, label){
  const tm=state.takeMap, v=tm.draft[k], editing=tm.editing===k;
  const inner = editing ? `<input class="dq dq-take" inputmode="numeric" value="${v!=null?v:have}" data-k="${esc(k)}" oninput="takeCellInput(${ja(k)},this.value,${have})">`
              : v!=null ? `<span class="dpick">${v}</span>` : `<span class="dadd">${have}</span>`;
  return `<div class="dcell take${v!=null?' taking':''}" data-cell="${esc(k)}" onclick="if(event.target.tagName!=='INPUT')takeCellTap(${ja(k)},${have})">${label?`<span class="dbase" style="color:var(--text-dim)">${esc(label)}</span>`:''}${inner}<span class="dcap">${have}</span></div>`;
}
function takeMapHtml(){
  const tm=state.takeMap; const sh=shedById(tm.shedId); const o=takeSel();
  const {m,pool}=takeHave(); const shown=new Set(); const cfg=sh.rowsCfg||[];
  let html='';
  if(cfg.length){
    const maxLen=Math.max(...cfg.map(r=>r.length));
    let head='<div class="dg-col dg-nums"><div class="dg-rowhdr"></div>';
    for(let s=1;s<=maxLen;s++){ head+=`<div class="dg-snum">${s}</div>`; }
    head+='</div>';
    let cols='';
    cfg.forEach(rc=>{
      cols+=`<div class="dg-col"><div class="dg-rowhdr">${t('row')} ${rc.n}</div>`;
      for(let s=1;s<=maxLen;s++){
        if(s>rc.length){ cols+=`<div class="dcell void"></div>`; continue; }
        const k=rc.n+'|'+s, have=m[k]||0;
        if(have<=0){ cols+=`<div class="dcell empty-take"></div>`; continue; }
        shown.add(k); cols+=takeCellHtml(k,have);
      }
      cols+='</div>';
    });
    html+=`<div class="dig-grid-scroll" style="max-height:56vh"><div class="dig-grid-h">${head}${cols}</div></div>`;
  }
  // позиції, яких немає на схемі (старі дані або після зміни сітки) — теж можна зняти
  const extra=Object.keys(m).filter(k=>!shown.has(k));
  if(extra.length){
    html+=`<div class="take-extra"><div class="take-extra-title">${t('outside_grid')}</div><div class="take-extra-row">${
      extra.map(k=>{ const i=k.indexOf('|'); return takeCellHtml(k,m[k],`${k.slice(0,i)}/${k.slice(i+1)}`); }).join('')}</div></div>`;
  }
  // без позиції — окрема клітинка: знімається так само, як стопка
  if(pool>0){
    html+=`<div class="take-extra"><div class="take-extra-title">${t('no_position')}</div><div class="take-extra-row" style="align-items:center">${takeCellHtml('|',pool)}
      <button class="more-link" style="padding:0 8px" onclick="closeSheet();openPlace(${ja(tm.shedId)},${ja(o.idRef)},${ja(o.size)})">${t('place_btn')}</button></div></div>`;
  }
  return html;
}
function takeCellTap(k, have){
  const tm=state.takeMap;
  if(tm.draft[k]==null){ tm.draft[k]=have; tm.editing=null; }   // 1-й тап — уся стопка
  else if(tm.editing!==k){ tm.editing=k; }                       // 2-й — ввести своє число
  else { delete tm.draft[k]; tm.editing=null; }                  // 3-й — зняти вибір
  const cell=document.querySelector(`.dcell[data-cell="${CSS.escape(k)}"]`);
  if(cell){ const label=cell.querySelector('.dbase')?.textContent||''; cell.outerHTML=takeCellHtml(k,have,label); }
  if(tm.editing===k){ const el=document.querySelector(`.dq-take[data-k="${CSS.escape(k)}"]`); if(el){ el.focus(); el.select(); } }
  updTakeTotal();
}
function takeCellInput(k, val, have){
  const tm=state.takeMap; let n=parseInt(val,10);
  if(isNaN(n)||n<=0){ tm.draft[k]=0; }
  else { if(n>have){ n=have; const el=document.querySelector(`.dq-take[data-k="${CSS.escape(k)}"]`); if(el)el.value=n; } tm.draft[k]=n; }
  updTakeTotal();
}
function takeTotalQty(){ return Object.values(state.takeMap.draft).reduce((a,b)=>a+(+b||0),0); }
function updTakeTotal(){
  const el=document.getElementById('take-total'); if(!el)return;
  const n=takeTotalQty(); const st=Object.values(state.takeMap.draft).filter(v=>+v>0).length;
  el.innerHTML = n? `<b style="color:var(--danger)">${n}</b> ${t('boxes')} · ${st} ${pl(st,'stacks_f')}` : t('take_tap_to_start');
}
// зібрати зняте у спільну форму
function takeCollect(){
  const tm=state.takeMap; const total=takeTotalQty();
  if(total<=0){ toast(t('take_nothing')); return null; }
  const o=takeSel();
  const taken=Object.entries(tm.draft).filter(([k,v])=>+v>0).map(([k,v])=>{ const i=k.indexOf('|'); return {row:k.slice(0,i),stack:k.slice(i+1),qty:+v}; });
  return {total, selId:o.idRef, selSize:o.size, taken};
}
// вибір дії після зняття
function takeProceed(){
  const c=takeCollect(); if(!c)return;
  openSheet(`<div class="sheet-top"><h2 style="margin:0">${c.total} ${t('boxes')}</h2><button class="sheet-x" onclick="renderTakeSheet()">✕</button></div>
    <p class="hint" style="margin:0 2px 14px">${t('what_to_do')}</p>
    ${whenRowHtml()}
    <button class="btn" style="background:var(--danger);color:#fff" onclick="doTakeSell()">${t('sell')}</button>
    <button class="btn" style="background:var(--move);color:#04222b;margin-top:10px" onclick="takeMove()">${t('move')}</button>
    ${c.selSize?'':`<button class="btn" style="margin-top:10px;background:var(--accent);color:#06180a" onclick="takeSort()">${t('sorting')}</button>`}
    <button class="btn ghost" style="margin-top:10px;color:var(--text-dim)" onclick="doTakeWriteoff()">${t('writeoff')}</button>`);
}
async function doTakeSell(){
  const c=takeCollect(); if(!c)return; const tm=state.takeMap; const id=idById(c.selId);
  if(!whenOk(c.selId,c.selSize,tm.shedId)) return;
  const ok=await runOp(d=>{
    c.taken.forEach(k=>d.remove(c.selId,c.selSize,'shed',tm.shedId,k.row,k.stack,k.qty));
    d.add(c.selId,c.selSize,'sold','','','',c.total);
    return {id:db.newOp(),ts:opTs(),entered:Date.now(),type:'sell',title:'sell',detail:`${id?id.code:'?'} · ${c.total}`,
      undo:{idRef:c.selId,size:c.selSize,shedId:tm.shedId,taken:c.taken,qty:c.total}};
  }, `${t('sold_done')} ${c.total}`);
  if(ok){ state.takeMap=null; closeSheet(); render(); }
}
async function doTakeWriteoff(){
  const c=takeCollect(); if(!c)return; const tm=state.takeMap; const id=idById(c.selId);
  if(!whenOk(c.selId,c.selSize,tm.shedId)) return;
  const ok=await runOp(d=>{
    c.taken.forEach(k=>d.remove(c.selId,c.selSize,'shed',tm.shedId,k.row,k.stack,k.qty));
    return {id:db.newOp(),ts:opTs(),entered:Date.now(),type:'writeoff',title:'writeoff',detail:`${id?id.code:'?'} · ${c.total}`,
      undo:{idRef:c.selId,size:c.selSize,shedId:tm.shedId,taken:c.taken,qty:c.total}};
  }, `${t('written_off')} ${c.total}`);
  if(ok){ state.takeMap=null; closeSheet(); render(); }
}
// куди перемістити: інший шед або цей самий (переставити)
function takeMove(){
  const c=takeCollect(); if(!c)return; const from=state.takeMap.shedId;
  const list=[...state.sheds].sort((a,b)=>(a.id===from)-(b.id===from));
  openSheet(`<div class="sheet-top"><h2 style="margin:0">${t('move')} · ${c.total} ${t('boxes')}</h2><button class="sheet-x" onclick="takeProceed()">✕</button></div>
    <p class="hint" style="margin:0 2px 14px">${t('move_to_shed')}</p>
    ${whenRowHtml()}
    ${list.map(s=>{
      const free = s.capacity ? Math.max(0, s.capacity - shedQty(s.id)) : null;
      const tight = s.id!==from && free!=null && free < c.total;
      return `<button class="btn secondary" style="margin-bottom:8px;text-align:left;display:flex;justify-content:space-between;align-items:center" onclick="doTakeMove(${ja(s.id)})">
        <span>${esc(s.name)}${s.id===from?` <span style="color:var(--text-faint);font-weight:600">· ${t('same_shed')}</span>`:''}</span>
        <span style="font-size:.82rem;font-weight:600;color:${tight?'var(--danger)':'var(--text-dim)'}">${free!=null?`${t('free_word')} ${free}`:'∞'}</span></button>`;
    }).join('')}
    <p class="hint" style="margin:6px 2px 0">${t('move_then_place')}</p>`);
}
async function doTakeMove(toShedId){
  const c=takeCollect(); if(!c)return; const tm=state.takeMap;
  const id=idById(c.selId); const fromSh=shedById(tm.shedId), toSh=shedById(toShedId);
  if(!whenOk(c.selId,c.selSize,tm.shedId)) return;
  const ok=await runOp(d=>{
    c.taken.forEach(k=>d.remove(c.selId,c.selSize,'shed',tm.shedId,k.row,k.stack,k.qty));
    d.add(c.selId,c.selSize,'shed',toShedId,'','',c.total);          // у цільовий шед — поки без позиції
    return {id:db.newOp(),ts:opTs(),entered:Date.now(),type:'move',title:'move',detail:`${id?id.code:'?'} · ${fromSh?fromSh.name:'?'} → ${toSh?toSh.name:'?'}`,
      undo:{idRef:c.selId,size:c.selSize,fromShed:tm.shedId,toShed:toShedId,taken:c.taken,qty:c.total}};
  }, `${t('moved')} ${c.total}`);
  if(!ok) return;
  state.takeMap=null; render();
  if(toSh && toSh.rowsCfg && toSh.rowsCfg.length) openPlace(toShedId, c.selId, c.selSize); else closeSheet();
}

/* ============================================================
   РУШІЙ ЗАЛИШКІВ
   Кожна операція працює з робочою копією партій: знімає й додає з перевіркою,
   і лише коли все зійшлося — пише зміни разом із записом журналу ОДНІЄЮ транзакцією.
   Бракує ящиків у точній стопці або стопка переповнюється — не пишеться нічого,
   а повідомлення каже, чого саме бракує. Старі дублікати партій (той самий
   idRef+size+status) не заважають: зняття шукає по всіх.
   ============================================================ */
class StockError extends Error {}
const stKey=s=>s==='sold'?'sold':'shed';           // усе, що не продане, — склад
function posInLayout(sh,row,stack){ const rc=rowCfg(sh,+row); return !!rc && +stack>=1 && +stack<=rc.length && stackHeight(sh,+row,+stack)>0; }
function stockDraft(){
  const list=state.batches.map(b=>({...b, size:b.size||'', locs:(b.locs||[]).map(l=>({...l}))}));
  const dirty=new Set();
  const same=(b,idRef,size,status)=>b.idRef===idRef && (b.size||'')===(size||'') && stKey(b.status)===stKey(status);
  const at=(l,shedId,row,stack)=>(l.shedId||'')===(shedId||'') && String(l.row??'')===String(row??'') && String(l.stack??'')===String(stack??'');
  function qtyAt(shedId,row,stack){ let q=0;
    list.forEach(b=>{ if(stKey(b.status)==='sold') return; b.locs.forEach(l=>{ if(at(l,shedId,row,stack)) q+=(+l.qty||0); }); });
    return q; }
  function add(idRef,size,status,shedId,row,stack,qty){
    qty=+qty; if(!(qty>0)||!Number.isInteger(qty)) throw new StockError(t('bad_qty'));
    row=row==null?'':String(row); stack=stack==null?'':String(stack);
    if(stKey(status)==='sold'){ shedId=''; row=''; stack=''; }
    else {
      const sh=shedById(shedId); if(!sh) throw new StockError(t('err_no_shed'));
      if(row||stack){
        if(!posInLayout(sh,row,stack)) throw new StockError(`${t('err_no_stack')}: ${sh.name}, ${posLabel(row,stack)}`);
        const h=stackHeight(sh,+row,+stack), now=qtyAt(shedId,row,stack);
        if(now+qty>h) throw new StockError(`${t('err_no_room')}: ${sh.name}, ${posLabel(row,stack)} (${now}+${qty} > ${h})`);
      }
    }
    let b=list.find(x=>same(x,idRef,size,status));
    if(!b){ b={id:db.newBatch(), idRef, size:size||'', status:stKey(status), locs:[]}; list.push(b); }
    const l=b.locs.find(l=>at(l,shedId,row,stack));
    if(l) l.qty=(+l.qty||0)+qty; else b.locs.push({shedId:shedId||'', row, stack, qty});
    dirty.add(b.id);
  }
  // зняти з точної локації; shedId==='*' — з будь-якої (для «проданого», де місце не має значення)
  function remove(idRef,size,status,shedId,row,stack,qty){
    qty=+qty; if(!(qty>0)) throw new StockError(t('bad_qty'));
    let need=qty;
    for(const b of list){ if(need<=0) break; if(!same(b,idRef,size,status)) continue;
      for(const l of b.locs){ if(need<=0) break; if(shedId!=='*' && !at(l,shedId,row,stack)) continue;
        const have=+l.qty||0; if(have<=0) continue;
        const take=Math.min(have,need); l.qty=have-take; need-=take; dirty.add(b.id); } }
    if(need>0){
      const id=idById(idRef), what=`${id?id.code:'?'}${size?' · '+size:''}`;
      const where= shedId==='*' ? t('sold_label') : `${shedById(shedId)?.name||'?'}, ${posLabel(row,stack)}`;
      throw new StockError(`${t('err_short')} ${need} ${t('boxes')} (${what}) — ${where}`);
    }
  }
  // обнулити всі від'ємні залишки (лише для виправлення старих збоїв); повертає, скільки додалось
  function zeroNegatives(){ let n=0; list.forEach(b=>b.locs.forEach(l=>{ const q=+l.qty||0; if(q<0){ n+=-q; l.qty=0; dirty.add(b.id); } })); return n; }
  async function commit(ops){
    const put=[], del=[];
    list.forEach(b=>{ if(!dirty.has(b.id)) return;
      b.locs=b.locs.filter(l=>(+l.qty||0)!==0);
      if(b.locs.length) put.push(b); else del.push(b.id); });
    await db.commit({put, del, ops});
  }
  return {add, remove, zeroNegatives, commit, qtyAt};
}
// зібрати операцію → перевірити → записати атомарно → перечитати
async function runOp(build, doneMsg, errPrefix){
  const d=stockDraft(); let ops;
  try { ops=build(d); }
  catch(e){ if(e instanceof StockError){ toast((errPrefix||'')+e.message, true); buzz([40,60,40]); return false; } throw e; }
  try { await d.commit(Array.isArray(ops)?ops:(ops?[ops]:[])); }
  catch(e){ console.error(e); toast(t('err_save'), true); await reload(); render(); return false; }
  await reload(); buzz(25); if(doneMsg) toast(doneMsg); return true;
}

function addSortRow(preset){

    ${sizes.length?`<div class="size-chips">${sizes.map(s=>`<span class="size-chip" onclick="this.closest('.sort-row').querySelector('.sr-size').value=${ja(s)}">${esc(s)}</span>`).join('')}</div>`:''}`;

function updSortBalance(){
  const sc=state.sortCtx; let out=0;
  document.querySelectorAll('#sort-rows .sr-qty').forEach(i=>out+=(+i.value||0));
  const loss=sc.total-out; const el=document.getElementById('sort-balance');
  if(!el)return;
  if(out===0){ el.innerHTML=`${t('distributed')}: 0 ${t('of_word')} ${sc.total}`; el.style.color='var(--text-faint)'; return; }
  if(loss<0){ el.innerHTML=`${t('distributed_more')} ${out} ${t('is_more_than')} ${sc.total}`; el.style.color='var(--danger)'; }
  else { el.innerHTML=`${t('distributed')} ${out} ${t('of_word')} ${sc.total} · ${t('losses_waste')}: <b>${loss}</b>`; el.style.color=loss>0?'var(--text-dim)':'var(--accent-hi)'; }
}
async function doSort(){
  const sc=state.sortCtx; const shedId=sc.shedId;
  const rows=[...document.querySelectorAll('#sort-rows .sort-row')].map(r=>({
    size:r.querySelector('.sr-size').value.trim(),
    qty:parseInt(r.querySelector('.sr-qty').value,10)||0,
  })).filter(x=>x.qty>0);
  if(!rows.length){ toast(t('add_one_result')); return; }
  for(const r of rows){ if(!r.size){ toast(t('enter_size_each')); return; } }
  const out=rows.reduce((s,r)=>s+r.qty,0);
  if(out>sc.total){ toast(t('more_than_input'),true); return; }
  const loss=sc.total-out; const id=idById(sc.selId);
  if(!whenOk(sc.selId,'',shedId)) return;
  const ok=await runOp(d=>{
    sc.taken.forEach(k=>d.remove(sc.selId,'','shed',shedId,k.row,k.stack,k.qty));   // зняти несортоване зі стопок
    rows.forEach(r=>d.add(sc.selId,r.size,'shed',shedId,'','',r.qty));               // розміри — без позиції в тому ж шеді
    return {id:db.newOp(),ts:opTs(),entered:Date.now(),type:'sort',title:'sort',
      detail:`${id?id.code:'?'} · ${sc.total} → ${rows.map(r=>r.size+' '+r.qty).join(', ')}${loss>0?` · ${t('losses_waste')} ${loss}`:''}`,
      undo:{idRef:sc.selId, shedId, taken:sc.taken, results:rows.map(r=>({size:r.size,qty:r.qty})), input:sc.total, loss}};
  }, t('sorted_done'));
  if(!ok) return;
  state.sortCtx=null; state.takeMap=null; closeSheet(); render();
}

/* ============================================================
   ПОШУК ID: «17» знаходить «017»; також поле, клас, сорт і характеристики
   ============================================================ */
const normS=s=>String(s||'').toLowerCase().replace(/[^0-9a-zа-яіїєґ]/gi,'');
const numsOf=s=>(String(s||'').match(/\d+/g)||[]).map(x=>String(parseInt(x,10)));
function searchIds(q){
  const nq=normS(q); if(!nq) return [];
  const qn=numsOf(q), qIsNum=/^\d+$/.test(nq); const out=[];
  state.ids.forEach(id=>{ const so=sortById(id.sortId); const code=normS(id.code); let sc=0, why='';
    if(code===nq) sc=100;
    else if(qIsNum && numsOf(id.code).includes(qn[0])) sc=90;
    else if(code.startsWith(nq)) sc=80;
    else if(code.includes(nq)) sc=70;
    else if(qIsNum && numsOf(id.field).includes(qn[0])){ sc=40; why=`${t('field')} ${id.field}`; }
    else { const src=[id.field?`${t('field')} ${id.field}`:'', id.cls?`${t('seed_class')} ${id.cls}`:'', so?so.name:'', ...(id.chars||[]).map(c=>c.v||'')];
      const hit=src.findIndex(h=>h&&normS(h).includes(nq)); if(hit>=0){ sc=30; why=src[hit]; } }
    if(sc) out.push({id,sc,why});
  });
  return out.sort((a,b)=>b.sc-a.sc||String(a.id.code).localeCompare(String(b.id.code),'uk',{numeric:true})).slice(0,30);
}
function searchRowHtml(id, why){
  const so=sortById(id.sortId); const stock=state.batches.filter(b=>b.idRef===id.id).reduce((s,b)=>s+stockQty(b),0);
  const sheds=idWhere(id.id).map(w=>shedById(w.shedId)?.name).filter(Boolean);
  const sub=why||[id.field?`${t('field')} ${id.field}`:'', sheds.join(', ')].filter(Boolean).join(' · ');
  return `<div class="res-row" onclick="closeSheet();openId('${id.id}')">${stickerHtml(id)}
    <div class="res-main"><div class="res-title">${esc(so?so.name:'?')}</div><div class="res-sub">${esc(sub)||'&nbsp;'}</div></div>
    <span class="res-q">${stock}</span></div>`;
}
function searchResultsHtml(q){
  if(!normS(q)){ const rec=recentIds();
    return rec.length?`<div class="res-label">${t('recent_title')}</div>`+rec.map(id=>searchRowHtml(id)).join('') : `<p class="hint" style="margin:6px 2px">${t('search_hint')}</p>`; }
  const r=searchIds(q);
  return r.length? r.map(x=>searchRowHtml(x.id,x.why)).join('') : `<p class="hint" style="margin:6px 2px">${t('search_none')}</p>`;
}
function openSearch(){

  const mode=state.searchKb||'numeric';

function searchKb(){ state.searchKb=(state.searchKb||'numeric')==='numeric'?'text':'numeric';

function searchEnter(){ const q=document.getElementById('q'); const r=searchIds(q?q.value:''); if(r.length&&(r.length===1||r[0].sc>=90)){ closeSheet(); openId(r[0].id.id); } }

const lastExport=()=>+localStorage.getItem(LS('last_export'))||0;
function lastChangeTs(){ let m=0;
  state.ops.forEach(o=>{ m=Math.max(m,o.ts||0,o.reversedAt||0,o.entered||0); });
  [...state.sorts,...state.ids,...state.sheds].forEach(x=>{ m=Math.max(m,x.mts||0,x.ts||0); });
  return m; }
// крапка на кнопці «Дані»: є зміни після останньої копії і вона старша за 3 дні (або її не було)
function backupStale(){ const ch=lastChangeTs(); if(!ch) return false; const le=lastExport(); return ch>le && (Date.now()-le>3*864e5); }
function updDataDot(){ const d=document.getElementById('data-dot'); if(d) d.hidden=!backupStale(); }
function fmtDT(ts){ const d=new Date(ts), loc=LANG==='uk'?'uk':'en-GB';
  return d.toLocaleDateString(loc,{day:'2-digit',month:'2-digit',year:'numeric'})+' '+d.toLocaleTimeString(loc,{hour:'2-digit',minute:'2-digit'}); }
function agoText(ts){ const n=Math.floor((Date.now()-ts)/864e5); return n<=0?t('today'):`${n} ${pl(n,'days_f')} ${t('ago')}`; }
const currentData=()=>({sorts:state.sorts, ids:state.ids, sheds:state.sheds, batches:state.batches, ops:state.ops});
const dataCounts=d=>({sorts:d.sorts.length, ids:d.ids.length, sheds:d.sheds.length, batches:d.batches.length, ops:d.ops.length});

async function openData(){
  let persisted=null; try{ if(navigator.storage&&navigator.storage.persisted) persisted=await navigator.storage.persisted(); }catch(e){}
  const le=lastExport(), stale=backupStale(), snap=readSnapshot(), canShare=!!navigator.canShare;

    ${canShare?`<button class="btn" onclick="exportBackup('share')">${t('backup_share')}</button>`:''}

    <p class="data-meta" style="margin-top:18px;color:var(--text-faint)">${t('db_label')}: ${esc(DB_NAME)} · ${t('app_version')} ${APP_VERSION}</p>`);

// ---- копія ----
function backupJson(){ return JSON.stringify({ app:'kartoplya', format:1, schema:3, version:APP_VERSION, db:DB_NAME,
  exportedAt:new Date().toISOString(), counts:dataCounts(currentData()), data:currentData() }); }
function backupName(){ const d=new Date(), p=n=>String(n).padStart(2,'0');
  return `kartoplya-${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.json`; }
function markExported(){ localStorage.setItem(LS('last_export'), String(Date.now())); updDataDot(); }
async function exportBackup(mode){
  const json=backupJson(), name=backupName();
  if(mode==='share' && navigator.canShare){
    // Android не завжди приймає .json — тоді той самий вміст як .txt (імпорт читає обидва)
    const variants=[new File([json],name,{type:'application/json'}), new File([json],name.replace(/\.json$/,'.txt'),{type:'text/plain'})];
    for(const f of variants){
      let ok=false; try{ ok=navigator.canShare({files:[f]}); }catch(e){}
      if(!ok) continue;
      try{ await navigator.share({files:[f], title:name}); markExported(); toast(t('backup_shared')); openData(); return; }
      catch(e){ if(e&&e.name==='AbortError') return; break; }
    }
  }
  const url=URL.createObjectURL(new Blob([json],{type:'application/json'}));
  const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),5000);
  markExported(); toast(t('backup_saved')); openData();
}

// ---- відновлення з файлу ----
function pickImport(){ const f=document.getElementById('imp-file'); f.value=''; f.click(); }
function validateBackup(obj){
  if(!obj||typeof obj!=='object') return null;
  if(obj.app && obj.app!=='kartoplya') return null;
  const d=(obj.data&&typeof obj.data==='object')?obj.data:obj; const out={};
  for(const k of db.STORES){ const arr=d[k]; if(!Array.isArray(arr)) return null;
    if(arr.some(x=>!x||typeof x!=='object'||typeof x.id!=='string'||!x.id)) return null; out[k]=arr; }
  if(out.batches.some(b=>!Array.isArray(b.locs)||typeof b.idRef!=='string')) return null;
  return out;
}
async function onImportFile(inp){
  const f=inp.files&&inp.files[0]; if(!f) return;
  let obj=null; try{ obj=JSON.parse(await f.text()); }catch(e){}
  const data=validateBackup(obj);
  if(!data){ toast(t('import_bad'),true); return; }
  const at=obj.exportedAt?Date.parse(obj.exportedAt):NaN;
  state.pendingImport={data};
  const cur=dataCounts(currentData()), nw=dataCounts(data);

      ${row('sorts',t('nav_sorts'))}${row('ids','ID')}${row('sheds',t('nav_sheds'))}${row('batches',t('batches_word'))}${row('ops',t('nav_log'))}</div>
    <div class="warn-box">${t('import_warn')}</div>
    <button class="btn" data-armed="0" style="background:var(--danger);color:#fff" onclick="confirmImport(this)">${t('import_replace')}</button>`);
}
function confirmImport(btn){ if(btn.dataset.armed==='1'){ doImport(); return; }
  btn.dataset.armed='1'; btn.textContent=t('confirm_again');
  setTimeout(()=>{ if(btn.isConnected){ btn.dataset.armed='0'; btn.textContent=t('import_replace'); } },4000); }

// ---- страховка: знімок перед імпортом, стиранням і поверненням ----
function writeSnapshot(reason){ try{ localStorage.setItem(LS('snapshot'), JSON.stringify({at:Date.now(), reason, data:currentData()})); return true; }catch(e){ return false; } }
function readSnapshot(){ try{ const x=JSON.parse(localStorage.getItem(LS('snapshot'))||'null'); return x&&x.data?x:null; }catch(e){ return null; } }
function confirmRestoreSnap(btn){ if(btn.dataset.armed==='1'){ doRestoreSnap(); return; }
  const old=btn.textContent; btn.dataset.armed='1'; btn.textContent=t('confirm_again'); btn.classList.add('confirm-armed');
  setTimeout(()=>{ if(btn.isConnected){ btn.dataset.armed='0'; btn.textContent=old; btn.classList.remove('confirm-armed'); } },4000); }
async function doRestoreSnap(){
  const snap=readSnapshot(); const data=snap&&validateBackup(snap.data); if(!data){ toast(t('import_bad'),true); return; }
  writeSnapshot('restore');       // поточний стан стає новою страховкою — повернення теж можна скасувати
  try{ await db.replaceAll(data); }catch(e){ toast(t('err_save'),true); return; }
  await reload(); closeSheet(); go('sorts'); toast(t('snap_done'));
}

// ---- стирання ----
function confirmWipe(btn){ if(btn.dataset.armed==='1'){ doWipe(); return; }
  btn.dataset.armed='1'; btn.textContent=t('wipe_confirm'); btn.classList.add('confirm-armed');
  setTimeout(()=>{ if(btn.isConnected){btn.dataset.armed='0';btn.textContent=t('wipe_all');btn.classList.remove('confirm-armed');} },4000); }
async function doWipe(){
  if(!writeSnapshot('wipe') && backupStale()){ toast(t('wipe_need_backup'),true); return; }
  try{ await db.replaceAll({sorts:[],ids:[],sheds:[],batches:[],ops:[]}); }catch(e){ toast(t('err_save'),true); return; }
  await reload(); closeSheet(); buzz(30); go('sorts'); toast(t('wiped_snap'));
}

// ---- перевірка даних ----
function integrity(){
  const groups={}, zero=[], neg=[], orphan=[], outside=[], over=[], noId=new Set(), occ={};
  state.batches.forEach(b=>{
    const k=b.idRef+'\u0001'+(b.size||'')+'\u0001'+stKey(b.status); (groups[k] ||= []).push(b);
    if(!idById(b.idRef)) noId.add(b.idRef);
    (b.locs||[]).forEach(l=>{ const q=+l.qty||0;
      if(q===0){ zero.push({b,l}); return; }
      if(q<0){ neg.push({b,l}); return; }
      if(stKey(b.status)==='sold') return;
      const sh=shedById(l.shedId);
      if(!sh){ orphan.push({b,l}); return; }
      if(l.row||l.stack){
        if(!posInLayout(sh,l.row,l.stack)){ outside.push({b,l}); return; }
        const ok=sh.id+'|'+l.row+'|'+l.stack; occ[ok]=(occ[ok]||0)+q; }
    }); });
  Object.entries(occ).forEach(([k,q])=>{ const [shId,r,c]=k.split('|'); const sh=shedById(shId); const h=stackHeight(sh,+r,+c); if(q>h) over.push({sh,r,c,q,h}); });
  return {dups:Object.values(groups).filter(a=>a.length>1), zero, neg, orphan, outside, over, noId:[...noId]};
}
function issueWho({b,l}){ const id=idById(b.idRef), sh=shedById(l.shedId);
  return `${id?id.code:'?'}${b.size?' · '+b.size:''}${stKey(b.status)==='sold'?' · '+t('sold'):(sh?' · '+sh.name:'')}${(l.row||l.stack)?', '+posLabel(l.row,l.stack):''}: ${l.qty}`; }
function integrityHtml(i){
  const out=[]; const list=a=>a.slice(0,5).map(x=>esc(issueWho(x))).join('<br>')+(a.length>5?`<br>+${a.length-5}`:'');
  if(i.dups.length||i.zero.length) out.push(`<div class="issue"><b>${t('iss_tech')}</b>: ${t('iss_dups')} ${i.dups.length}, ${t('iss_zero')} ${i.zero.length}
    <div class="issue-list">${t('iss_tech_hint')}</div>
    <button class="btn secondary" style="margin-top:10px" onclick="fixTech()">${t('fix_tech')}</button></div>`);
  if(i.orphan.length){ const q=i.orphan.reduce((a,x)=>a+(+x.l.qty||0),0);
    out.push(`<div class="issue"><b>${t('iss_orphan')}</b>: ${q} ${t('boxes')}<div class="issue-list">${list(i.orphan)}</div>
    ${state.sheds.length?`<select id="orph-shed">${state.sheds.map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('')}</select>
    <button class="btn secondary" style="margin-top:8px" onclick="fixOrphans()">${t('fix_orphan')}</button>`:''}</div>`); }
  if(i.neg.length) out.push(`<div class="issue"><b>${t('iss_neg')}</b><div class="issue-list">${list(i.neg)}</div>
    <div class="issue-list">${t('iss_neg_hint')}</div>
    <button class="btn ghost" data-armed="0" style="color:var(--danger)" onclick="confirmFixNeg(this)">${t('fix_neg')}</button></div>`);
  if(i.outside.length) out.push(`<div class="issue"><b>${t('iss_outside')}</b><div class="issue-list">${list(i.outside)}</div><div class="issue-list">${t('iss_outside_hint')}</div></div>`);
  if(i.over.length) out.push(`<div class="issue"><b>${t('iss_over')}</b><div class="issue-list">${i.over.slice(0,5).map(x=>esc(`${x.sh.name}, ${posLabel(x.r,x.c)}: ${x.q} > ${x.h}`)).join('<br>')}</div></div>`);
  if(i.noId.length) out.push(`<div class="issue"><b>${t('iss_noid')}</b>: ${i.noId.length}<div class="issue-list">${t('iss_noid_hint')}</div></div>`);
  return out.length?out.join(''):`<div class="issue ok">${t('iss_ok')}</div>`;
}
// без втрат: злити дублікати партій і прибрати нульові записи (кількості не змінюються)
async function fixTech(){
  const groups={}; state.batches.forEach(b=>{ const k=b.idRef+'\u0001'+(b.size||'')+'\u0001'+stKey(b.status); (groups[k] ||= []).push(b); });
  const put=[], del=[];
  Object.values(groups).forEach(arr=>{
    if(arr.length<2 && !arr[0].locs.some(l=>(+l.qty||0)===0)) return;
    const keep={...arr[0], size:arr[0].size||'', locs:[]};
    arr.forEach(b=>(b.locs||[]).forEach(l=>{ const q=+l.qty||0; if(q===0) return;
      const row=l.row==null?'':String(l.row), stack=l.stack==null?'':String(l.stack), shedId=l.shedId||'';
      const m=keep.locs.find(x=>x.shedId===shedId&&x.row===row&&x.stack===stack);
      if(m) m.qty+=q; else keep.locs.push({...l, shedId, row, stack, qty:q}); }));
    arr.slice(1).forEach(b=>del.push(b.id));
    if(keep.locs.length) put.push(keep); else del.push(keep.id);
  });
  try{ await db.commit({put,del,ops:[]}); }catch(e){ toast(t('err_save'),true); return; }
  await reload(); render(); toast(t('fixed')); openData();
}
async function fixOrphans(){
  const sh=shedById(document.getElementById('orph-shed')?.value); if(!sh) return;
  const iss=integrity(); if(!iss.orphan.length) return;
  const ok=await runOp(d=>{ let n=0;
    iss.orphan.forEach(({b,l})=>{ const q=+l.qty||0; if(q<=0) return;
      d.remove(b.idRef,b.size||'','shed',l.shedId||'',l.row??'',l.stack??'',q);
      d.add(b.idRef,b.size||'','shed',sh.id,'','',q); n+=q; });
    return {id:db.newOp(),ts:Date.now(),type:'adjust',title:'adjust',qty:n,detail:`${t('iss_orphan')} → ${sh.name} (${t('no_position')})`};
  }, t('fixed'));
  if(ok){ render(); openData(); }
}
function confirmFixNeg(btn){ if(btn.dataset.armed==='1'){ fixNeg(); return; }
  btn.dataset.armed='1'; btn.textContent=t('confirm_again'); btn.classList.add('confirm-armed');
  setTimeout(()=>{ if(btn.isConnected){ btn.dataset.armed='0'; btn.textContent=t('fix_neg'); btn.classList.remove('confirm-armed'); } },4000); }
async function fixNeg(){
  const ok=await runOp(d=>{ const n=d.zeroNegatives(); if(!n) return null;
    return {id:db.newOp(),ts:Date.now(),type:'adjust',title:'adjust',qty:n,detail:t('iss_neg_fixed')}; }, t('fixed'));
  if(ok){ render(); openData(); }
}

(async function init(){
  if(navigator.storage&&navigator.storage.persist){ navigator.storage.persist().catch(()=>{}); }
  applyTheme(); applyLang();
  try{ await reload(); }
  catch(e){ console.error(e); document.getElementById('app').innerHTML=`<div class="empty">${IC.box}<br>${t('db_open_fail')}<br><small>${esc(e&&e.message||e)}</small></div>`; return; }
  updateSpace(); render();
})();
// service worker: встановлення і робота без мережі (лише з http/https, не з file://)
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      reg.addEventListener('updatefound', ()=>{ const w=reg.installing; if(!w) return;
        w.addEventListener('statechange', ()=>{ if(w.state==='activated' && navigator.serviceWorker.controller) toast(t('update_ready')); }); });
    }).catch(e=>console.warn('SW', e));
  });
}
